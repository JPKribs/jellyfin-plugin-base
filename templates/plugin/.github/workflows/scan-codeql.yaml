name: '🔬 Run CodeQL'
# Synced from jellyfin-plugin-base templates/plugin by scripts/sync-plugins.sh; edit it there.

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: JPKribs/jellyfin-plugin-base/.github/workflows/plugin-codeql.yaml@<SHA> # <VERSION>
    with:
      repository-name: <REPOSITORY>
