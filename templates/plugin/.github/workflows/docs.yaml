name: '📚 Publish Docs'
# Synced from jellyfin-plugin-base templates/plugin by scripts/sync-plugins.sh; edit it there.

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    uses: JPKribs/jellyfin-plugin-base/.github/workflows/plugin-docs.yaml@<SHA> # <VERSION>
