<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JPKribs Base UI Gallery</title>

<!-- The icon font Jellyfin ships, material-design-icons-iconfont. Its per-icon classes, such as expand_more, draw the icons that have no text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-design-icons-iconfont@6.7.0/dist/material-design-icons.min.css" />
<!-- The bundled kit stylesheet, which scripts/gallery.sh rebuilds -->
<link rel="stylesheet" href="../../dist/jpkribs_shared.css" />

<style>
    /* Gallery chrome only (prefixed g-* so it never touches the kit classes under test). */
    body {
        margin: 0;
        background: #101010;
        color: #f2f2f2;
        font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .g-wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 120px; }
    .g-title { font-size: 1.6rem; font-weight: 700; margin: 0 0 var(--base-gap-narrow); }
    .g-sub { opacity: 0.55; margin: 0 0 var(--base-gap-wide); font-size: 0.9rem; }
    .g-section {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 18px 20px 22px;
        margin: 0 0 var(--base-gap-wide);
        background: rgba(255, 255, 255, 0.015);
    }
    .g-section > h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.55;
        margin: 0 0 var(--base-gap-wide);
        font-weight: 700;
    }
    .g-row { display: flex; flex-wrap: wrap; gap: var(--base-gap-narrow); align-items: center; }
    .g-swatches { display: flex; flex-wrap: wrap; gap: var(--base-gap-narrow); }
    .g-swatch { width: 96px; text-align: center; font-size: 0.7rem; opacity: 0.8; }
    .g-swatch .chip { height: 40px; border-radius: 8px; margin-bottom: var(--base-gap-narrow); border: 1px solid rgba(255,255,255,0.1); }
    .g-note { font-size: 0.8rem; opacity: 0.5; margin: var(--base-gap-narrow) 0 0; }
    .g-gap-top { margin-top: var(--base-gap-wide); }
    .g-push { margin-left: auto !important; }
</style>
</head>

<!-- The page wrapper carries pluginConfigurationPage so the form rules apply as on a config page -->
<body>
<div class="pluginConfigurationPage">
<div class="g-wrap" id="view">
    <div class="g-title">JPKribs Base UI Gallery</div>
    <p class="g-sub">Every shipped component, rendered from the real bundled <code>jpkribs_shared.css</code> / <code>.js</code>.</p>
</div>
</div>

<!-- The shared stubs of the dashboard globals with mock data, as a classic script so it runs before the module below -->
<script src="../../docs/previews/_stubs.js"></script>

<script type="module">
import * as base from '../../dist/jpkribs_shared.js';

const view = document.getElementById('view');
const D = window.__galleryData;
const G = window.__gallery;
const shared = base.createShared(view, 'gallery-plugin-id', 'Gallery');

// Adds a titled section card to the page and returns it.
function section(title) {
    const s = document.createElement('div');
    s.className = 'g-section';
    const h = document.createElement('h2');
    h.textContent = title;
    s.appendChild(h);
    view.appendChild(s);
    return s;
}
function row(parent) {
    const r = document.createElement('div');
    r.className = 'g-row';
    parent.appendChild(r);
    return r;
}
function html(parent, markup) {
    const d = document.createElement('div');
    d.innerHTML = markup;
    parent.appendChild(d);
    return d;
}

(function () {
    const s = section('Palette & tokens');
    const wrap = document.createElement('div');
    wrap.className = 'g-swatches';
    [['--base-accent', 'accent'], ['--base-success', 'success'], ['--base-warning', 'warning'],
     ['--base-error', 'error'], ['--base-blue-fg', 'blue'], ['--base-purple-fg', 'purple'], ['--base-border', 'border'],
     ['--base-on-accent', 'on-accent'], ['--base-accent-wash', 'accent-wash'], ['--base-wash', 'wash'], ['--base-wash-strong', 'wash-strong'],
     ['--base-pink-fg', 'pink'], ['--base-teal-fg', 'teal']]
    .forEach(([v, name]) => {
        const sw = document.createElement('div');
        sw.className = 'g-swatch';
        sw.innerHTML = '<div class="chip" style="background:var(' + v + ')"></div>' + name;
        wrap.appendChild(sw);
    });
    s.appendChild(wrap);
})();

(function () {
    const s = section('Buttons');
    const r = row(s);
    r.innerHTML =
        '<button class="raised base-button primary">Submit</button>' +
        '<button class="raised base-button destructive">Delete</button>' +
        '<button class="raised base-button secondary">Secondary</button>' +

        '<button class="base-button"><span class="material-icons">add</span><span>Icon button</span></button>';
    const custom = document.createElement('button');
    custom.className = 'raised base-button'; custom.textContent = 'Custom #e91e63';
    base.applyColor(custom, '#e91e63');
    const light = document.createElement('button');
    light.className = 'raised base-button'; light.textContent = 'Custom #ffd54f';
    base.applyColor(light, '#ffd54f');
    r.appendChild(custom); r.appendChild(light);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">The three sizes, each on its own line, since buttons on one line share a size.</p>');
    html(s, '<div class="g-row"><button class="raised base-button primary small">Small</button></div>');
    html(s, '<div class="g-row"><button class="raised base-button primary">Medium</button></div>');
    html(s, '<div class="g-row"><button class="raised base-button primary large">Large</button></div>');
    s.insertAdjacentHTML('beforeend', '<p class="g-note">fill spans the width on a medium or large button. In a base-button-row, fill buttons share it a wide space apart.</p>');
    html(s, '<button class="raised base-button primary fill">Save</button>');
    html(s, '<div class="base-button-row" style="margin-top:var(--base-gap-wide)"><button class="raised base-button secondary fill">Cancel</button><button class="raised base-button primary fill">Save</button></div>');
})();

(function () {
    const s = section('Status callouts');
    html(s, '<div class="base-info">base-info, a neutral hint or guidance.</div>').style.marginBottom = '8px';
    html(s, '<div class="base-success">base-success, a healthy or completed state.</div>').style.marginBottom = '8px';
    html(s, '<div class="base-warn">base-warn, a caution worth heeding.</div>').style.marginBottom = '8px';
    html(s, '<div class="base-error">base-error, a blocking problem.</div>').style.marginBottom = '8px';
    html(s, '<div class="base-neutral">base-neutral, a muted, inactive note.</div>').style.marginBottom = '8px';
    html(s, '<div class="base-error-message">TypeError: cannot read properties of undefined (reading \'Items\')</div>');
})();

(function () {
    const s = section('Status text');
    const line = document.createElement('span');
    line.id = 'demoStatus';
    line.className = 'base-status-text';
    const r = row(s);
    const ok = document.createElement('button'); ok.className = 'raised base-button small'; ok.textContent = 'Show success';
    const bad = document.createElement('button'); bad.className = 'raised base-button small'; bad.textContent = 'Show error';
    ok.onclick = () => shared.setStatus('demoStatus', 'Saved successfully.', false, { timeout: 0 });
    bad.onclick = () => shared.setStatus('demoStatus', 'Something went wrong.', true, { timeout: 0 });
    r.appendChild(ok); r.appendChild(bad); r.appendChild(line);
})();

(function () {
    const s = section('Count cards');
    const host = document.createElement('div'); host.id = 'demoCards';
    s.appendChild(host);
    shared.renderCards('demoCards', [
        { label: 'Queued', count: 12, color: 'orange' },
        { label: 'Synced', count: 340, color: 'green' },
        { label: 'Errored', count: 3, color: 'red' },
        { label: 'Ignored', count: 8, color: 'gray' },
        { label: 'Pending', count: 21, color: 'purple' },
        { label: 'Custom', count: 7, color: '#e91e63' }
    ]);
    html(s, '<div class="base-record-card" style="margin-top:var(--base-gap-wide)">' +
        '<div class="base-record-row"><span class="base-record-label">Last run</span><span>2 minutes ago</span></div>' +
        '<div class="base-record-row"><span class="base-record-label">Result</span><span class="base-mono">OK</span></div>' +
        '<div class="base-record-row"><span class="base-record-label">Address</span><span class="base-mono">203.0.113.7</span></div>' +
        '</div>');
})();

(function () {
    const s = section('Badges');
    const r = row(s);
    base.BADGE_STATES.names.forEach(n => r.insertAdjacentHTML('beforeend', shared.statusBadge(n, n) + ' '));
    const r2 = row(s); r2.style.marginTop = '10px';
    base.BADGE_STATES.colors.forEach(c => r2.insertAdjacentHTML('beforeend', shared.badge(c, c) + ' '));
    ['#e91e63', '#00bcd4', '#ff9800'].forEach(c => r2.insertAdjacentHTML('beforeend', shared.badge(c, c) + ' '));
})();

(function () {
    const s = section('Tags');
    html(s, '<div class="base-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="base-tag">' + t + '<span class="base-tag-remove material-icons">close</span></span>').join('') +
        '</div>');
    html(s, '<div class="base-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="base-tag">' + t + '<button type="button" class="base-tag-remove material-icons" aria-label="Remove ' + t + '">close</button></span>').join('') +
        '</div>');
    html(s, '<div class="base-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="base-tag base-tag-pill">' + t + '<button type="button" class="base-tag-remove material-icons" aria-label="Remove ' + t + '">close</button></span>').join('') +
        '<span class="base-tag base-tag-off">Off tag</span></div>');
    s.insertAdjacentHTML('beforeend', '<p class="g-note">Row one is span removers, row two is real buttons with a focus ring, row three is base-tag-pill.</p>');
})();

(function () {
    const s = section('Fields & inputs');
    html(s, '<div class="base-field-row">' +
        '<div class="base-field"><label>Host name</label><input type="text" value="server.example.com" /></div>' +
        '<div class="base-field"><label>Port</label><input type="number" value="8096" /></div>' +
        '</div>');
    html(s, '<div class="inputContainer"><label>API key</label><input type="password" class="g-fields-secret" /></div>');
    base.bindSecretField(s.querySelector('.g-fields-secret'), true);
    html(s, '<div class="selectContainer"><label>Mode</label><select><option>Allowlist</option><option>Blocklist</option><option>None</option></select></div>');
    html(s, '<div class="inputContainer"><label>Notes</label><textarea rows="2">Multi-line text area.</textarea></div>');
})();

(function () {
    const s = section('Record selector');
    html(s, '<div class="base-selector">' +
        '<select class="base-selector-dropdown"><option>Primary record</option><option>Backup record</option></select>' +
        '<div class="base-selector-actions">' +
            '<button class="base-button"><span class="material-icons">add</span><span>New</span></button>' +
            '<button class="base-button"><span class="material-icons">delete</span><span>Delete</span></button>' +
        '</div></div>');
})();

(function () {
    const s = section('Collapsible sections');
    s.insertAdjacentHTML('beforeend',
        '<div class="base-collapsible-section">' +
          '<button type="button" class="base-collapsible-header" data-target="colA">' +
            '<span class="base-collapsible-title">Advanced options</span>' +
            '<span class="base-collapsible-icon"></span></button>' +
          '<div id="colA" class="base-collapsible-content"><p style="opacity:.7;margin:0">Expanded content lives here.</p></div>' +
        '</div>' +
        '<div class="base-collapsible-section">' +
          '<button type="button" class="base-collapsible-header collapsed" data-target="colB">' +
            '<span class="base-collapsible-title">Starts collapsed</span>' +
            '<span class="base-collapsible-icon"></span></button>' +
          '<div id="colB" class="base-collapsible-content collapsed"><p style="opacity:.7;margin:0">Hidden until toggled.</p></div>' +
        '</div>');
    shared.initCollapsibles();
})();

(function () {
    const s = section('Sortable card list');
    const list = document.createElement('div');
    s.appendChild(list);
    const editor = document.createElement('div');
    editor.innerHTML = '<div class="inputContainer"><label>Name</label><input is="emby-input" type="text" value="Edited in place"></div>' +
        '<div class="base-collapsible-actions"><button class="base-button primary small">Save</button></div>';
    const records = [
        { name: 'Living room', url: 'http://living:8096', mode: 'Both', dot: 'ok' },
        { name: 'Cabin', url: 'http://cabin:8096', mode: 'Scan', dot: 'bad' },
        { name: 'Backup', url: 'http://backup:8096', mode: 'Send', dot: 'checking', disabled: true }
    ];
    const cards = base.createSortableCardList(list, {
        items: records,
        editor: editor,
        render: (r) => ({ title: r.name, subtitle: r.url, dot: r.dot, disabled: r.disabled,
            badges: [{ label: r.mode, cls: r.mode === 'Both' ? 'purple' : r.mode === 'Send' ? 'blue' : 'green' }].concat(r.disabled ? [{ label: 'Disabled', cls: 'gray' }] : []) }),
        onMove: (from, to) => shared.setStatus('cardListStatus', 'Moved ' + (from + 1) + ' to ' + (to + 1), true)
    });
    cards.setSelected(0);
    html(s, '<div class="base-card-list-actions"><button class="base-button primary"><span class="material-icons">add</span><span>Add</span></button></div>' +
        '<span id="cardListStatus" class="base-status-text"></span>');
})();

(function () {
    const s = section('Choice cards');
    const group = html(s, '<div class="base-choice-group" role="radiogroup">' +
        '<label class="base-choice"><input type="radio" name="g-mode" value="Scan" checked><span class="base-choice-name">Scan</span><span class="base-choice-text">Pull from this server on a schedule.</span></label>' +
        '<label class="base-choice"><input type="radio" name="g-mode" value="Send"><span class="base-choice-name">Send</span><span class="base-choice-text">Tell this server about changes as they happen.</span></label>' +
        '<label class="base-choice"><input type="radio" name="g-mode" value="Both"><span class="base-choice-name">Both</span><span class="base-choice-text">Scan and Send together.</span></label>' +
        '</div><span id="choiceStatus" class="base-status-text"></span>').querySelector('.base-choice-group');
    base.createChoiceGroup(group, { onChange: (v) => shared.setStatus('choiceStatus', 'Chose ' + v, true) });
})();

(function () {
    const s = section('Numbered collapsible sections');
    s.insertAdjacentHTML('beforeend',
        '<div class="base-collapsible-section numbered">' +
          '<button type="button" class="base-collapsible-header" data-target="stepA">' +
            '<span class="base-collapsible-title">Connection</span>' +
            '<span class="base-collapsible-icon"></span></button>' +
          '<div id="stepA" class="base-collapsible-content"><p style="opacity:.7;margin:0">Fields for the first step.</p></div>' +
        '</div>' +
        '<div class="base-collapsible-section numbered">' +
          '<button type="button" class="base-collapsible-header collapsed" data-target="stepB">' +
            '<span class="base-collapsible-title">Libraries</span>' +
            '<span class="base-collapsible-icon"></span></button>' +
          '<div id="stepB" class="base-collapsible-content collapsed"><p style="opacity:.7;margin:0">Fields for the second step.</p></div>' +
        '</div>');
    shared.initCollapsibles();
})();

(function () {
    const s = section('Searchable combo box');
    const OPTIONS = ['Aardvark', 'Albatross', 'Beaver', 'Bison', 'Cheetah', 'Cobra', 'Dolphin', 'Eagle', 'Falcon'];
    const combo = shared.createSearchableComboBox({
        placeholder: 'Type to search animals…',
        searchFn: (q, cb) => cb(OPTIONS.filter(o => !q || o.toLowerCase().indexOf(q.toLowerCase()) !== -1)
            .map(o => ({ value: o.toLowerCase(), label: o }))),
        onSelect: (value) => shared.setStatus('comboStatus', 'Picked: ' + value, false, { timeout: 0 })
    });
    s.appendChild(combo.element);
    const st = document.createElement('span'); st.id = 'comboStatus'; st.className = 'base-status-text';
    s.appendChild(st);
})();

(function () {
    const s = section('Chip multi-select');
    const chip = base.createChipSelect({
        placeholder: 'Add genres…',
        value: ['drama'],
        options: [
            { value: 'action', label: 'Action' }, { value: 'comedy', label: 'Comedy' },
            { value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' },
            { value: 'horror', label: 'Horror' }, { value: 'documentary', label: 'Documentary' }
        ],
        allowCreate: true
    });
    s.appendChild(chip.element);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">Type to filter, click or Enter to add, the close button or Backspace to remove. allowCreate lets you add a free-typed value.</p>');
    const pills = base.createChipSelect({
        pill: true,
        placeholder: 'Add genres as pills…',
        value: [{ value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' }],
        options: [{ value: 'action', label: 'Action' }, { value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' }]
    });
    pills.element.style.marginTop = '14px';
    s.appendChild(pills.element);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">pill: true draws each chip as base-tag-pill.</p>');

    // A single select picker backed by an async search that stores an opaque value and shows a friendly label.
    const LANGS = [
        { value: 'eng', label: 'English' }, { value: 'fra', label: 'French' }, { value: 'deu', label: 'German' },
        { value: 'spa', label: 'Spanish' }, { value: 'jpn', label: 'Japanese' }, { value: 'kor', label: 'Korean' }
    ];
    const lang = base.createChipSelect({
        placeholder: 'Search a language…',
        single: true,
        value: [{ value: 'eng', label: 'English' }],
        searchFn: (q, cb) => cb(LANGS.filter(l => !q || l.label.toLowerCase().indexOf(q.toLowerCase()) !== -1)),
        onChange: (values, items) => shared.setStatus('langStatus',
            items.length ? ('stored code: ' + values[0] + ' (label kept: ' + items[0].label + ')') : 'cleared', false, { timeout: 0 })
    });
    lang.element.style.marginTop = '14px';
    s.appendChild(lang.element);
    const st = document.createElement('span'); st.id = 'langStatus'; st.className = 'base-status-text';
    s.appendChild(st);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">single: true is an async, searchable single-picker that stores an opaque value (ISO code) but keeps the label via getItems().</p>');
})();

(function () {
    const s = section('Searchable checkbox list');
    const SERIES = [];
    for (let i = 1; i <= 12; i++) {
        SERIES.push({ id: 's' + i, name: 'Series ' + i, year: 2000 + i,
            poster: G.rect(32, 32, D.COLORS[i % D.COLORS.length], String(i)) });
    }
    const list = base.createCheckboxList({
        items: SERIES,
        value: ['s2', 's5'],
        disabledIds: ['s9'],
        searchKeys: ['name'],
        showSelectAll: true,
        selectAllText: 'Select every series',
        renderRow: (it) => ({ label: it.name, sublabel: 'First aired ' + it.year, imageUrl: it.poster,
            note: it.id === 's9' ? 'assigned' : '' })
    });
    s.appendChild(list.element);
})();

(function () {
    const s = section('User selectors');
    const single = shared.createUserSelector({ value: 'u2' });
    s.appendChild(single.element);
    const multi = shared.createUserMultiSelector({ value: ['u1', 'u3'], showSelectAll: true, adminFilter: 'all' });
    multi.element.style.marginTop = '12px';
    s.appendChild(multi.element);
})();

(function () {
    const s = section('Dialogs');
    const r = row(s);
    const b1 = document.createElement('button'); b1.className = 'raised base-button primary'; b1.textContent = 'openDialog';
    b1.onclick = () => base.openDialog({
        title: 'A modal dialog',
        body: '<p style="opacity:.8">Backdrop click, the close button, and Escape all close it. Focus is trapped inside.</p>',
        buttons: [
            { text: 'Close', className: 'base-button secondary', action: (close) => close() },
            { text: 'Primary', className: 'base-button primary', action: (close) => close() }
        ]
    });
    const b2 = document.createElement('button'); b2.className = 'raised base-button destructive'; b2.textContent = 'confirmDialog';
    b2.onclick = () => base.confirmDialog('Delete this record? This cannot be undone.', { title: 'Delete record', destructive: true, confirmText: 'Delete' })
        .then(ok => shared.setStatus('dialogStatus', 'confirm resolved: ' + ok, !ok, { timeout: 0 }));
    const b3 = document.createElement('button'); b3.className = 'raised base-button secondary'; b3.textContent = 'promptDialog';
    b3.onclick = () => base.promptDialog(
        [{ name: 'label', label: 'Label', value: 'My record' }, { name: 'ttl', label: 'TTL (seconds)', type: 'number', value: '300' }],
        { title: 'New record', submitText: 'Create' })
        .then(vals => shared.setStatus('dialogStatus', vals ? ('prompt: ' + JSON.stringify(vals)) : 'prompt cancelled', !vals, { timeout: 0 }));
    const b4 = document.createElement('button'); b4.className = 'raised base-button secondary'; b4.id = 'demoEditor'; b4.textContent = 'openEditorDialog';
    b4.onclick = () => {
        const body = document.createElement('div');
        body.innerHTML = '<div class="inputContainer"><label>Name</label><input type="text" id="demoEditorName" value="Living room"></div>' +
            '<div class="inputContainer"><label>Starts on</label><input type="date" value="2026-03-10"></div>';
        const input = body.querySelector('input');
        const editor = base.openEditorDialog({
            title: 'Edit Record', body: body, serialize: () => input.value, cancelText: 'Cancel',
            onRemove: (close) => close('removed'),
            onDone: () => true,
            onClose: (value) => shared.setStatus('dialogStatus', 'editor closed: ' + (value || 'dismissed'), false, { timeout: 0 })
        });
    };
    const b5 = document.createElement('button'); b5.className = 'raised base-button secondary'; b5.id = 'demoWide'; b5.textContent = 'openDialog wide';
    b5.onclick = () => {
        let more = '';
        for (let i = 1; i <= 12; i++) more += '<div class="inputContainer"><label>Field ' + i + '</label><input type="text" value="Value ' + i + '"></div>';
        base.openDialog({
            title: 'A Wide Dialog', size: 'large', body: more,
            buttons: [
                { text: 'Delete', className: 'base-button destructive', action: (close) => close() },
                { text: 'Cancel', className: 'base-button secondary', action: (close) => close() },
                { text: 'Done', className: 'base-button primary', action: (close) => close() }
            ]
        });
    };
    r.appendChild(b1); r.appendChild(b2); r.appendChild(b3); r.appendChild(b4); r.appendChild(b5);
    const st = document.createElement('span'); st.id = 'dialogStatus'; st.className = 'base-status-text'; st.style.marginTop = '8px';
    s.appendChild(st);
})();

(function () {
    const s = section('Dialog in page markup');
    s.insertAdjacentHTML('beforeend',
        '<div id="demoStaticDialog" class="base-dialog hidden">' +
          '<div class="base-dialog-content small">' +
            '<button type="button" class="base-row-btn base-dialog-close" title="Close" aria-label="Close"><span class="material-icons" aria-hidden="true">close</span></button>' +
            '<h2 class="base-modal-title">Session log</h2>' +

        bulkActions: [
            { id: 'ignore', label: 'Ignore', icon: 'block', onClick: (items) => { setState(items.map((i) => i.id), 'Ignored'); list.clearSelection(); } },
            { id: 'queue', label: 'Queue', icon: 'playlist_add', variant: 'primary', onClick: (items) => { setState(items.map((i) => i.id), 'Queued'); list.clearSelection(); } }
        ],
        actions: [{ id: 'retry', label: 'Retry Errors', icon: 'refresh', onClick: () => setState(all.filter((i) => i.state === 'Errored').map((i) => i.id), 'Queued'), visible: () => all.some((i) => i.state === 'Errored') }],
        limit: 200,
        limitText: 'Showing the latest {shown} of {total}. Filter by state or server to see more.',
        onOpen: (item) => base.openDialog({ title: item.name, body: '<p>' + base.escapeHtml(item.type + ', ' + item.state + ', ' + (detailOf(item) || 'no detail')) + '</p>', buttons: [{ text: 'Done', className: 'base-button primary' }] }),
        height: 420
    });
    // The servers arrive after the first load, as Server Sync's peer pills do.
    setTimeout(() => list.setFilterOptions('peer', peers), 600);
    // A poll every 3 seconds changes one item's state, and only that row draws again.
    let tick = 0;
    setInterval(() => {
        tick++;
        const at = (tick * 13) % 40;
        all = all.map((item, i) => i === at ? Object.assign({}, item, { state: item.state === 'Synced' ? 'Queued' : 'Synced' }) : item);
        list.setItems(all);
    }, 3000);
    s.appendChild(list.element);
})();


// The newest components show their docs preview, the one demo each has, sized to its content.
(function () {
    const pages = [
        ['Time range field', 'time-range-field'], ['Duration field', 'duration-field'], ['Date range picker', 'date-range-picker'],
        ['Checkbox', 'checkbox'], ['Collapsible section headers and panels', 'collapsible-section'], ['Stat card status', 'stat-card'],
        ['Definition list columns', 'definition-list'], ['Paginated table thumbnails', 'paginated-table'], ['Inherit field', 'inherit-field'], ['Repeater', 'repeater'], ['Rule builder', 'rule-builder'],
        ['Record list', 'record-list'], ['Tree view', 'tree-view'], ['Compare table', 'compare-table'], ['Matrix grid', 'matrix-grid'],
        ['Bar chart', 'bar-chart'], ['Line chart', 'line-chart'], ['Sparkline', 'sparkline'], ['Usage meter', 'usage-meter'],
        ['Relative time', 'relative-time'], ['Avatar stack', 'avatar-stack'], ['QR code', 'qr-code'], ['Audio player', 'audio-player'],
        ['Preview frame', 'preview-frame'], ['Detail drawer', 'detail-drawer'], ['Setup checklist', 'setup-checklist']
    ];
    const frames = [];
    pages.forEach(([title, name]) => {
        const s = section(title);
        const frame = document.createElement('iframe');
        frame.className = 'g-preview';
        frame.title = title + ' example';
        frame.loading = 'lazy';
        frame.src = '../../docs/assets/previews/' + name + '.html?theme=dark';
        frame.style.cssText = 'display:block;width:100%;border:0;min-height:120px;background:transparent';
        s.appendChild(frame);
        frames.push(frame);
    });
    window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'base-preview-height') return;
        const frame = frames.find((f) => f.contentWindow === e.source);
        if (frame && e.data.height > 0) frame.style.height = Math.ceil(e.data.height) + 'px';
    });
})();

base.bindFieldAdornments(document.body);
</script>
