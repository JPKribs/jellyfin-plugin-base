<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JPKribs Base UI Gallery</title>

<!-- The Material Icons font that the kit icons use through the material-icons class -->
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<!-- The bundled kit stylesheet, which scripts/gallery.sh rebuilds -->
<link rel="stylesheet" href="../../dist/jpkribs_shared.css" />

<style>
    /* Gallery chrome only (prefixed g-* so it never touches the kit classes under test). */
    body {
        margin: 0;
        background: #101010;
        color: #f2f2f2;
        font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .g-wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 120px; }
    .g-title { font-size: 1.6rem; font-weight: 700; margin: 0 0 4px; }
    .g-sub { opacity: 0.55; margin: 0 0 28px; font-size: 0.9rem; }
    .g-section {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 18px 20px 22px;
        margin: 0 0 22px;
        background: rgba(255, 255, 255, 0.015);
    }
    .g-section > h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.55;
        margin: 0 0 14px;
        font-weight: 700;
    }
    .g-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .g-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .g-swatch { width: 96px; text-align: center; font-size: 0.7rem; opacity: 0.8; }
    .g-swatch .chip { height: 40px; border-radius: 8px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .g-note { font-size: 0.8rem; opacity: 0.5; margin: 10px 0 0; }
</style>
</head>

<!-- The page wrapper carries pluginConfigurationPage so the form rules and token aliases apply as on a config page -->
<body>
<div class="pluginConfigurationPage">
<div class="g-wrap" id="view">
    <div class="g-title">JPKribs Base UI Gallery</div>
    <p class="g-sub">Every shipped component, rendered from the real bundled <code>jpkribs_shared.css</code> / <code>.js</code>.</p>
</div>
</div>

<!-- Stubs of the dashboard globals with mock data, as a classic script so it runs before the module below -->
<script>
(function () {
    function svg(w, h, bg, label) {
        var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
            '<rect width="' + w + '" height="' + h + '" rx="' + Math.min(w, h) / 2 + '" fill="' + bg + '"/>' +
            '<text x="50%" y="54%" font-size="' + (h * 0.4) + '" fill="#fff" text-anchor="middle" ' +
            'dominant-baseline="middle" font-family="sans-serif">' + label + '</text></svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
    }
    function rect(w, h, bg, label) {
        var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
            '<rect width="' + w + '" height="' + h + '" rx="4" fill="' + bg + '"/>' +
            '<text x="50%" y="55%" font-size="' + (h * 0.5) + '" fill="#fff" text-anchor="middle" ' +
            'dominant-baseline="middle" font-family="sans-serif">' + label + '</text></svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
    }
    window.__gallery = { svg: svg, rect: rect };

    var COLORS = ['#0088cc', '#9b59b6', '#5cb85c', '#f0ad4e', '#d9534f', '#3498db'];
    var USERS = [
        { Id: 'u1', Name: 'Alice',   Policy: { IsAdministrator: true },  PrimaryImageTag: 't1' },
        { Id: 'u2', Name: 'Bob',     Policy: { IsAdministrator: false }, PrimaryImageTag: 't2' },
        { Id: 'u3', Name: 'Carol',   Policy: { IsAdministrator: false }, PrimaryImageTag: null },
        { Id: 'u4', Name: 'Dave',    Policy: { IsAdministrator: true },  PrimaryImageTag: 't4' },
        { Id: 'u5', Name: 'Eve',     Policy: { IsAdministrator: false }, PrimaryImageTag: 't5' }
    ];

    // Mock media rows for the paginated table.
    var STATUSES = ['Synced', 'Queued', 'Errored', 'Downloading', 'Ignored', 'Imported'];
    var ITEMS = [];
    for (var i = 1; i <= 57; i++) {
        ITEMS.push({
            id: 'item-' + i,
            name: 'Episode ' + i + ', The One With The ' + ['Cache', 'Sync', 'Retry', 'Backoff', 'Token'][i % 5],
            sizeBytes: (i * 37 % 900 + 20) * 1024 * 1024,
            status: STATUSES[i % STATUSES.length]
        });
    }

    window.Dashboard = { alert: function (m) { window.alert(typeof m === 'string' ? m : (m && m.message) || 'alert'); } };

    var config = { Demo: true, Count: 1 };
    window.ApiClient = {
        getUsers: function () { return Promise.resolve(USERS.slice()); },
        getUserImageUrl: function (id, o) {
            var u = USERS.filter(function (x) { return x.Id === id; })[0];
            return svg(56, 56, COLORS[USERS.indexOf(u) % COLORS.length], (u ? u.Name[0] : '?'));
        },
        getPluginConfiguration: function () { return Promise.resolve(JSON.parse(JSON.stringify(config))); },
        updatePluginConfiguration: function (id, c) { config = c; return Promise.resolve(c); },
        getUrl: function (u) { return u; },
        fetch: function (opts) {
            // Serve the mock paginated table from the query string.
            var q = {};
            (opts.url.split('?')[1] || '').split('&').forEach(function (p) {
                var kv = p.split('='); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || '');
            });
            var skip = parseInt(q.skip || '0', 10), take = parseInt(q.take || '50', 10);
            var filtered = ITEMS.filter(function (it) {
                return !q.search || it.name.toLowerCase().indexOf(q.search.toLowerCase()) !== -1;
            });
            return Promise.resolve({ Items: filtered.slice(skip, skip + take), TotalCount: filtered.length });
        }
    };
    window.__galleryData = { USERS: USERS, ITEMS: ITEMS, COLORS: COLORS, STATUSES: STATUSES };
})();
</script>

<script type="module">
import * as JPK from '../../dist/jpkribs_shared.js';

const view = document.getElementById('view');
const D = window.__galleryData;
const G = window.__gallery;
const shared = JPK.createShared(view, 'gallery-plugin-id', 'Gallery');

// Adds a titled section card to the page and returns it.
function section(title) {
    const s = document.createElement('div');
    s.className = 'g-section';
    const h = document.createElement('h2');
    h.textContent = title;
    s.appendChild(h);
    view.appendChild(s);
    return s;
}
function row(parent) {
    const r = document.createElement('div');
    r.className = 'g-row';
    parent.appendChild(r);
    return r;
}
function html(parent, markup) {
    const d = document.createElement('div');
    d.innerHTML = markup;
    parent.appendChild(d);
    return d;
}

(function () {
    const s = section('Palette & tokens');
    const wrap = document.createElement('div');
    wrap.className = 'g-swatches';
    [['--jpk-accent', 'accent'], ['--jpk-success', 'success'], ['--jpk-warning', 'warning'],
     ['--jpk-error', 'error'], ['--jpk-info', 'info'], ['--jpk-purple', 'purple'], ['--jpk-border', 'border'],
     ['--jpk-on-accent', 'on-accent'], ['--jpk-accent-wash', 'accent-wash'], ['--jpk-wash', 'wash'], ['--jpk-wash-strong', 'wash-strong'],
     ['--jpk-pink-fg', 'pink'], ['--jpk-teal-fg', 'teal']]
    .forEach(([v, name]) => {
        const sw = document.createElement('div');
        sw.className = 'g-swatch';
        sw.innerHTML = '<div class="chip" style="background:var(' + v + ')"></div>' + name;
        wrap.appendChild(sw);
    });
    s.appendChild(wrap);
})();

(function () {
    const s = section('Buttons');
    const r = row(s);
    r.innerHTML =
        '<button class="raised jpk-button-submit">Submit</button>' +
        '<button class="raised jpk-button-primary">Primary</button>' +
        '<button class="raised jpk-button-destructive">Delete</button>' +
        '<button class="raised jpk-secondary">Secondary</button>' +
        '<button class="raised jpk-button-small">Small</button>' +
        '<button class="jpk-icon-btn"><span class="material-icons">add</span><span>Icon button</span></button>';
})();

(function () {
    const s = section('Status callouts');
    html(s, '<div class="jpk-info">jpk-info, a neutral hint or guidance.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-success">jpk-success, a healthy or completed state.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-warn">jpk-warn, a caution worth heeding.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-error">jpk-error, a blocking problem.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-neutral">jpk-neutral, a muted, inactive note.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-error-message">TypeError: cannot read properties of undefined (reading \'Items\')</div>');
})();

(function () {
    const s = section('Status text (shared.setStatus)');
    const line = document.createElement('span');
    line.id = 'demoStatus';
    line.className = 'jpk-status-text';
    const r = row(s);
    const ok = document.createElement('button'); ok.className = 'raised jpk-button-small'; ok.textContent = 'Show success';
    const bad = document.createElement('button'); bad.className = 'raised jpk-button-small'; bad.textContent = 'Show error';
    ok.onclick = () => shared.setStatus('demoStatus', 'Saved successfully.', false, { timeout: 0 });
    bad.onclick = () => shared.setStatus('demoStatus', 'Something went wrong.', true, { timeout: 0 });
    r.appendChild(ok); r.appendChild(bad); r.appendChild(line);
})();

(function () {
    const s = section('Count cards (shared.renderCards)');
    const host = document.createElement('div'); host.id = 'demoCards';
    s.appendChild(host);
    shared.renderCards('demoCards', [
        { label: 'Queued', count: 12, color: 'orange' },
        { label: 'Synced', count: 340, color: 'green' },
        { label: 'Errored', count: 3, color: 'red' },
        { label: 'Ignored', count: 8, color: 'gray' },
        { label: 'Pending', count: 21, color: 'purple' }
    ]);
    html(s, '<div class="jpk-record-card" style="margin-top:14px">' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Last run</span><span>2 minutes ago</span></div>' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Result</span><span class="jpk-mono">OK</span></div>' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Address</span><span class="jpk-mono">203.0.113.7</span></div>' +
        '</div>');
})();

(function () {
    const s = section('Badges (BADGE_STATES)');
    const r = row(s);
    JPK.BADGE_STATES.names.forEach(n => r.insertAdjacentHTML('beforeend', shared.statusBadge(n, n) + ' '));
    const r2 = row(s); r2.style.marginTop = '10px';
    JPK.BADGE_STATES.colors.forEach(c => r2.insertAdjacentHTML('beforeend', shared.badge(c, c) + ' '));
})();

(function () {
    const s = section('Tags');
    html(s, '<div class="jpk-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="jpk-tag">' + t + '<span class="jpk-tag-remove">×</span></span>').join('') +
        '</div>');
    html(s, '<div class="jpk-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="jpk-tag">' + t + '<button type="button" class="jpk-tag-remove" aria-label="Remove ' + t + '">×</button></span>').join('') +
        '</div>');
    html(s, '<div class="jpk-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="jpk-tag jpk-tag-pill">' + t + '<button type="button" class="jpk-tag-remove" aria-label="Remove ' + t + '">×</button></span>').join('') +
        '<span class="jpk-tag jpk-tag-off">Off tag</span></div>');
    s.insertAdjacentHTML('beforeend', '<p class="g-note">Row one is span removers, row two is real buttons with a focus ring, row three is jpk-tag-pill.</p>');
})();

(function () {
    const s = section('Fields & inputs');
    html(s, '<div class="jpk-field-row">' +
        '<div class="jpk-field"><label>Host name</label><input type="text" value="server.example.com" /></div>' +
        '<div class="jpk-field"><label>Port</label><input type="number" value="8096" /></div>' +
        '</div>');
    html(s, '<div class="inputContainer"><label>API key</label><input type="password" value="secret-value" /></div>');
    html(s, '<div class="selectContainer"><label>Mode</label><select><option>Allowlist</option><option>Blocklist</option><option>None</option></select></div>');
    html(s, '<div class="inputContainer"><label>Notes</label><textarea rows="2">Multi-line text area.</textarea></div>');
})();

(function () {
    const s = section('Record selector (jpk-selector)');
    html(s, '<div class="jpk-selector">' +
        '<select class="jpk-selector-dropdown"><option>Primary record</option><option>Backup record</option></select>' +
        '<div class="jpk-selector-actions">' +
            '<button class="jpk-icon-btn"><span class="material-icons">add</span><span>New</span></button>' +
            '<button class="jpk-icon-btn"><span class="material-icons">delete</span><span>Delete</span></button>' +
        '</div></div>');
})();

(function () {
    const s = section('Collapsible sections');
    s.insertAdjacentHTML('beforeend',
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header" data-target="colA">' +
            '<span class="jpk-collapsible-title">Advanced options</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="colA" class="jpk-collapsible-content"><p style="opacity:.7;margin:0">Expanded content lives here.</p></div>' +
        '</div>' +
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header collapsed" data-target="colB">' +
            '<span class="jpk-collapsible-title">Starts collapsed</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="colB" class="jpk-collapsible-content collapsed"><p style="opacity:.7;margin:0">Hidden until toggled.</p></div>' +
        '</div>');
    shared.initCollapsibles();
})();

(function () {
    const s = section('Sortable card list (createSortableCardList)');
    const list = document.createElement('div');
    s.appendChild(list);
    const editor = document.createElement('div');
    editor.innerHTML = '<div class="inputContainer"><label>Name</label><input is="emby-input" type="text" value="Edited in place"></div>' +
        '<div class="jpk-collapsible-actions"><button class="jpk-button-submit jpk-button-small">Save</button></div>';
    const records = [
        { name: 'Living room', url: 'http://living:8096', mode: 'Both', dot: 'ok' },
        { name: 'Cabin', url: 'http://cabin:8096', mode: 'Scan', dot: 'bad' },
        { name: 'Backup', url: 'http://backup:8096', mode: 'Send', dot: 'checking', disabled: true }
    ];
    const cards = JPK.createSortableCardList(list, {
        items: records,
        editor: editor,
        render: (r) => ({ title: r.name, subtitle: r.url, dot: r.dot, disabled: r.disabled,
            badges: [{ label: r.mode, cls: r.mode === 'Both' ? 'purple' : r.mode === 'Send' ? 'blue' : 'green' }].concat(r.disabled ? [{ label: 'Disabled', cls: 'gray' }] : []) }),
        onMove: (from, to) => shared.setStatus('cardListStatus', 'Moved ' + (from + 1) + ' to ' + (to + 1), true)
    });
    cards.setSelected(0);
    html(s, '<div class="jpk-card-list-actions"><button class="jpk-icon-btn jpk-button-submit"><span class="material-icons">add</span><span>Add</span></button></div>' +
        '<span id="cardListStatus" class="jpk-status-text"></span>');
})();

(function () {
    const s = section('Choice cards (createChoiceGroup)');
    const group = html(s, '<div class="jpk-choice-group" role="radiogroup">' +
        '<label class="jpk-choice"><input type="radio" name="g-mode" value="Scan" checked><span class="jpk-choice-name">Scan</span><span class="jpk-choice-text">Pull from this server on a schedule.</span></label>' +
        '<label class="jpk-choice"><input type="radio" name="g-mode" value="Send"><span class="jpk-choice-name">Send</span><span class="jpk-choice-text">Tell this server about changes as they happen.</span></label>' +
        '<label class="jpk-choice"><input type="radio" name="g-mode" value="Both"><span class="jpk-choice-name">Both</span><span class="jpk-choice-text">Scan and Send together.</span></label>' +
        '</div><span id="choiceStatus" class="jpk-status-text"></span>').querySelector('.jpk-choice-group');
    JPK.createChoiceGroup(group, { onChange: (v) => shared.setStatus('choiceStatus', 'Chose ' + v, true) });
})();

(function () {
    const s = section('Step headers (jpk-step-title)');
    s.insertAdjacentHTML('beforeend',
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header" data-target="stepA">' +
            '<span class="jpk-collapsible-title jpk-step-title"><span class="jpk-step-number">1</span> Connection</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="stepA" class="jpk-collapsible-content"><p style="opacity:.7;margin:0">Fields for the first step.</p></div>' +
        '</div>' +
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header collapsed" data-target="stepB">' +
            '<span class="jpk-collapsible-title jpk-step-title"><span class="jpk-step-number">2</span> Libraries</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="stepB" class="jpk-collapsible-content collapsed"><p style="opacity:.7;margin:0">Fields for the second step.</p></div>' +
        '</div>');
    shared.initCollapsibles();
})();

(function () {
    const s = section('Searchable combo box (shared.createSearchableComboBox)');
    const OPTIONS = ['Aardvark', 'Albatross', 'Beaver', 'Bison', 'Cheetah', 'Cobra', 'Dolphin', 'Eagle', 'Falcon'];
    const combo = shared.createSearchableComboBox({
        placeholder: 'Type to search animals…',
        searchFn: (q, cb) => cb(OPTIONS.filter(o => !q || o.toLowerCase().indexOf(q.toLowerCase()) !== -1)
            .map(o => ({ value: o.toLowerCase(), label: o }))),
        onSelect: (value) => shared.setStatus('comboStatus', 'Picked: ' + value, false, { timeout: 0 })
    });
    s.appendChild(combo.element);
    const st = document.createElement('span'); st.id = 'comboStatus'; st.className = 'jpk-status-text';
    s.appendChild(st);
})();

(function () {
    const s = section('Chip multi-select (createChipSelect)');
    const chip = JPK.createChipSelect({
        placeholder: 'Add genres…',
        value: ['drama'],
        options: [
            { value: 'action', label: 'Action' }, { value: 'comedy', label: 'Comedy' },
            { value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' },
            { value: 'horror', label: 'Horror' }, { value: 'documentary', label: 'Documentary' }
        ],
        allowCreate: true
    });
    s.appendChild(chip.element);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">Type to filter, click or Enter to add, × or Backspace to remove. allowCreate lets you add a free-typed value.</p>');
    const pills = JPK.createChipSelect({
        pill: true,
        placeholder: 'Add genres as pills…',
        value: [{ value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' }],
        options: [{ value: 'action', label: 'Action' }, { value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' }]
    });
    pills.element.style.marginTop = '14px';
    s.appendChild(pills.element);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">pill: true draws each chip as jpk-tag-pill.</p>');

    // A single select picker backed by an async search that stores an opaque value and shows a friendly label.
    const LANGS = [
        { value: 'eng', label: 'English' }, { value: 'fra', label: 'French' }, { value: 'deu', label: 'German' },
        { value: 'spa', label: 'Spanish' }, { value: 'jpn', label: 'Japanese' }, { value: 'kor', label: 'Korean' }
    ];
    const lang = JPK.createChipSelect({
        placeholder: 'Search a language…',
        single: true,
        value: [{ value: 'eng', label: 'English' }],
        searchFn: (q, cb) => cb(LANGS.filter(l => !q || l.label.toLowerCase().indexOf(q.toLowerCase()) !== -1)),
        onChange: (values, items) => shared.setStatus('langStatus',
            items.length ? ('stored code: ' + values[0] + ' (label kept: ' + items[0].label + ')') : 'cleared', false, { timeout: 0 })
    });
    lang.element.style.marginTop = '14px';
    s.appendChild(lang.element);
    const st = document.createElement('span'); st.id = 'langStatus'; st.className = 'jpk-status-text';
    s.appendChild(st);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">single: true is an async, searchable single-picker that stores an opaque value (ISO code) but keeps the label via getItems().</p>');
})();

(function () {
    const s = section('Searchable checkbox list (createCheckboxList)');
    const SERIES = [];
    for (let i = 1; i <= 12; i++) {
        SERIES.push({ id: 's' + i, name: 'Series ' + i, year: 2000 + i,
            poster: G.rect(32, 32, D.COLORS[i % D.COLORS.length], String(i)) });
    }
    const list = JPK.createCheckboxList({
        items: SERIES,
        value: ['s2', 's5'],
        disabledIds: ['s9'],
        searchKeys: ['name'],
        showSelectAll: true,
        selectAllText: 'Select every series',
        renderRow: (it) => ({ label: it.name, sublabel: 'First aired ' + it.year, imageUrl: it.poster,
            note: it.id === 's9' ? 'assigned' : '' })
    });
    s.appendChild(list.element);
})();

(function () {
    const s = section('User selectors (createUserSelector / createUserMultiSelector)');
    const single = shared.createUserSelector({ value: 'u2' });
    s.appendChild(single.element);
    const multi = shared.createUserMultiSelector({ value: ['u1', 'u3'], showSelectAll: true, adminFilter: 'all' });
    multi.element.style.marginTop = '12px';
    s.appendChild(multi.element);
})();

(function () {
    const s = section('Dialogs (openDialog / confirmDialog / promptDialog)');
    const r = row(s);
    const b1 = document.createElement('button'); b1.className = 'raised jpk-button-submit'; b1.textContent = 'openDialog';
    b1.onclick = () => JPK.openDialog({
        title: 'A modal dialog',
        body: '<p style="opacity:.8">Backdrop click, the × button, and Escape all close it. Focus is trapped inside.</p>',
        buttons: [
            { text: 'Close', className: 'jpk-secondary', action: (close) => close() },
            { text: 'Primary', className: 'jpk-button-submit', action: (close) => close() }
        ]
    });
    const b2 = document.createElement('button'); b2.className = 'raised jpk-button-destructive'; b2.textContent = 'confirmDialog';
    b2.onclick = () => JPK.confirmDialog('Delete this record? This cannot be undone.', { title: 'Delete record', destructive: true, confirmText: 'Delete' })
        .then(ok => shared.setStatus('dialogStatus', 'confirm resolved: ' + ok, !ok, { timeout: 0 }));

    html(s, '<div style="margin-top:14px"></div>').firstChild.appendChild(JPK.createSkeleton({ lines: 3 }).element);
    const r2 = row(s);
    r2.style.marginTop = '14px';
    r2.appendChild(JPK.createSkeleton({ type: 'circle', size: 'medium' }).element);
    const block = JPK.createSkeleton({ type: 'block', size: 'small' }).element;
    block.style.flex = '1';
    r2.appendChild(block);
})();

(function () {
    const s = section('Definition list, status dot, and divider');
    s.appendChild(JPK.createDefinitionList({ items: [{ label: 'Version', value: '12.4.14.1' }, { label: 'Id', value: '2f40d5d8-5b6a', mono: true }, { label: 'Last Sync' }] }).element);
    s.appendChild(JPK.createDivider({ label: 'Or' }).element);
    s.appendChild(JPK.createDivider().element);
    const r = row(s);
    ['green', 'red', 'orange', 'purple', 'blue', 'gray'].forEach((color) => r.appendChild(JPK.createStatusDot({ color }).element));
})();

(function () {
    const s = section('Log viewer');
    const log = JPK.createLogViewer({ lines: [{ text: 'Starting the session', level: 'info', time: '10:00:01' }, { text: 'Retrying in 5 seconds', level: 'warn', time: '10:00:03' }, { text: 'Could not reach the server', level: 'error', time: '10:00:08' }, { text: 'Detail line', level: 'debug', time: '10:00:08' }], maxLines: 50 });
    s.appendChild(log.element);
    const r = row(s);
    r.style.marginTop = '10px';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'raised jpk-button-small';
    b.textContent = 'Append Lines';
    let n = 0;
    b.addEventListener('click', () => { for (let i = 0; i < 5; i++) log.append({ text: 'Line ' + (++n), level: i === 4 ? 'warn' : 'info' }); });
    r.appendChild(b);
})();

(function () {
    const s = section('Sub tabs and stepper');
    s.appendChild(JPK.createSubTabs({
        tabs: [{ id: 'general', label: 'General', text: 'General settings live here.' }, { id: 'advanced', label: 'Advanced' }, { id: 'off', label: 'Disabled', disabled: true }, { id: 'logs', label: 'Logs' }],
        render: (tab) => tab.id === 'general' ? null : '<p style="margin:0">Built the first time ' + shared.escapeHtml(tab.label) + ' opened.</p>'
    }).element);
    const stepper = JPK.createStepper({ steps: [{ id: 'a', label: 'Connect', description: 'Pick a server' }, { id: 'b', label: 'Choose', description: 'Select content' }, { id: 'c', label: 'Review' }], value: 'b', clickable: true, onSelect: (id) => stepper.setValue(id) });
    stepper.element.style.marginTop = '20px';
    s.appendChild(stepper.element);
    const r = row(s);
    r.style.marginTop = '10px';
    [['Back', () => stepper.previous()], ['Next', () => stepper.next()]].forEach(([t, f]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'raised jpk-button-small';
        b.textContent = t;
        b.addEventListener('click', f);
        r.appendChild(b);
    });
})();

(function () {
    const s = section('Pagination, search field, and breadcrumbs');
    s.appendChild(JPK.createBreadcrumbs({ items: [{ label: 'Servers', value: 'servers' }, { label: 'Library', href: '#library' }, { label: 'Settings' }], onSelect: (v) => shared.setStatus('crumbStatus', 'Opened ' + v, false, { timeout: 0 }) }).element);
    html(s, '<span id="crumbStatus" class="jpk-status-text"></span>');
    const search = JPK.createSearchField({ placeholder: 'alice', onInput: (v) => shared.setStatus('searchStatus', 'Searched ' + JSON.stringify(v), false, { timeout: 0 }) });
    search.element.style.margin = '14px 0';
    s.appendChild(search.element);
    html(s, '<span id="searchStatus" class="jpk-status-text"></span>');
    const pager = JPK.createPagination({ total: 245, pageSize: 10, page: 4, onChange: (v) => shared.setStatus('pagerStatus', 'skip ' + v.skip + ' take ' + v.take, false, { timeout: 0 }) });
    pager.element.style.marginTop = '14px';
    s.appendChild(pager.element);
    html(s, '<span id="pagerStatus" class="jpk-status-text"></span>');
})();

(function () {
    const s = section('Number with unit, slider, and schedule picker');
    s.appendChild(JPK.createNumberUnitField({ units: [{ value: 'MB', factor: 1 }, { value: 'GB', factor: 1024 }], value: 512, unit: 'MB', min: 1, max: 4096 }).element);
    html(s, '<p class="g-note">Type 5000 to see the range message.</p>');
    s.appendChild(JPK.createSliderField({ min: 0, max: 255, value: 128, suffix: ' of 255', label: 'Opacity' }).element);
    const sched = JPK.createSchedulePicker({ value: { time: '02:30', days: [1, 3, 5] }, onChange: (v) => shared.setStatus('schedStatus', JSON.stringify(v), false, { timeout: 0 }) });
    sched.element.style.marginTop = '14px';
    s.appendChild(sched.element);
    html(s, '<span id="schedStatus" class="jpk-status-text"></span>');
})();

(function () {
    const s = section('Banner');
    const wrap = document.createElement('div');
    s.appendChild(wrap);
    const mem = {};
    ['info', 'success', 'warn', 'error', 'neutral'].forEach((kind) => wrap.appendChild(JPK.createBanner({ kind, title: kind === 'warn' ? 'Back up first' : '', text: 'This is a ' + kind + ' banner. Dismissing it remembers nothing unless a key and storage are given.', key: kind === 'info' ? 'demo-info' : undefined, storage: kind === 'info' ? { get: (k) => mem[k], set: (k, v) => { mem[k] = v; } } : undefined }).element));
})();

(function () {
    const s = section('Avatar, user chip, stat card, and progress ring');
    const r = row(s);
    r.appendChild(JPK.createAvatar({ name: 'Ada Lovelace', size: 'small' }).element);
    r.appendChild(JPK.createAvatar({ name: 'Bob Ross', status: 'green' }).element);
    r.appendChild(JPK.createAvatar({ name: 'Carol', size: 'large', status: 'red', statusLabel: 'Offline' }).element);
    r.appendChild(JPK.createAvatar({ src: G.svg(64, 64, '#0088cc', 'D'), name: 'Dave' }).element);
    r.appendChild(JPK.createAvatar({ src: 'data:image/png;base64,AAAA', name: 'Eve Adams' }).element);
    const r2 = row(s);
    r2.style.marginTop = '12px';
    r2.appendChild(JPK.createUserChip({ name: 'Ada Lovelace', text: 'Administrator', status: 'green' }).element);
    r2.appendChild(JPK.createUserChip({ name: 'Bob', src: G.svg(64, 64, '#9b59b6', 'B') }).element);
    const cards = document.createElement('div');
    cards.className = 'jpk-cards';
    cards.style.marginTop = '14px';
    cards.appendChild(JPK.createStatCard({ value: '1,204', label: 'Items', color: 'blue', trend: 12, trendSuffix: '%', trendLabel: 'vs last week' }).element);
    cards.appendChild(JPK.createStatCard({ value: 7, label: 'Errors', color: 'red', trend: 3, positiveIsGood: false }).element);
    cards.appendChild(JPK.createStatCard({ value: 98, label: 'Uptime', color: 'green', trend: -1, trendSuffix: '%' }).element);
    cards.appendChild(JPK.createStatCard({ value: 4, label: 'Servers', trend: 0 }).element);
    s.appendChild(cards);
    const r3 = row(s);
    r3.style.marginTop = '14px';
    [['small', 25, ''], ['medium', 60, 'green'], ['large', 90, 'orange']].forEach(([size, value, color]) => r3.appendChild(JPK.createProgressRing({ size, value, color }).element));
})();

(function () {
    const s = section('Timeline');
    s.appendChild(JPK.createTimeline({ items: [
        { time: '10:00', datetime: '2026-03-10T10:00', title: 'Sync started', body: 'Two servers in the pool.', status: 'purple', icon: 'sync' },
        { time: '10:04', title: 'Library synced', body: '1,204 items.', status: 'green', icon: 'check' },
        { time: '10:06', title: 'One item skipped', status: 'orange' },
        { time: '10:07', title: 'Could not reach a server', body: 'The request timed out.', status: 'red' }
    ] }).element);
})();

(function () {
    const s = section('Deprecated (kept for existing plugins)');
    const r = row(s);
    r.innerHTML = '<button class="raised jpk-button-primary">jpk-button-primary</button>' +
        '<span class="jpk-readonly">jpk-readonly</span>' +
        '<span class="jpk-edit-line-spacer"></span>';
    html(s, '<div class="jpk-empty-state"><div class="jpk-empty-state-card"><span class="jpk-empty-state-icon material-icons">inbox</span>' +
        '<div class="jpk-empty-state-title">Nothing here yet</div><div class="jpk-empty-state-subtitle">Add an item to get started.</div>' +
        '<button type="button" class="raised jpk-empty-state-button">Add</button></div></div>').style.marginTop = '12px';
})();
</script>
</body>
</html>
