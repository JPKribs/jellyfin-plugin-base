<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JPKribs Base — UI Gallery</title>

<!-- The real, freshly-bundled kit stylesheet. Run scripts/gallery.sh to (re)bundle and serve. -->
<link rel="stylesheet" href="../../dist/jpkribs_shared.css" />

<style>
    /* Gallery chrome only (prefixed g-* so it never touches the kit classes under test). */
    body {
        margin: 0;
        background: #101010;
        color: #f2f2f2;
        font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    .g-wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 120px; }
    .g-title { font-size: 1.6rem; font-weight: 700; margin: 0 0 4px; }
    .g-sub { opacity: 0.55; margin: 0 0 28px; font-size: 0.9rem; }
    .g-section {
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 18px 20px 22px;
        margin: 0 0 22px;
        background: rgba(255, 255, 255, 0.015);
    }
    .g-section > h2 {
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.55;
        margin: 0 0 14px;
        font-weight: 700;
    }
    .g-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .g-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .g-swatch { width: 96px; text-align: center; font-size: 0.7rem; opacity: 0.8; }
    .g-swatch .chip { height: 40px; border-radius: 8px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .g-note { font-size: 0.8rem; opacity: 0.5; margin: 10px 0 0; }
</style>
</head>

<!-- Wrapped in .pluginConfigurationPage so the field/form rules and the scoped token aliases apply,
     exactly as they do on a real Jellyfin config page. -->
<body>
<div class="pluginConfigurationPage">
<div class="g-wrap" id="view">
    <div class="g-title">JPKribs Base — UI Gallery</div>
    <p class="g-sub">Every shipped component, rendered from the real bundled <code>jpkribs_shared.css</code> / <code>.js</code>.</p>
</div>
</div>

<!-- Stub the Jellyfin dashboard globals the kit JS reaches for, with mock data, so every component runs
     stand-alone. Classic script runs before the deferred module below. -->
<script>
(function () {
    function svg(w, h, bg, label) {
        var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
            '<rect width="' + w + '" height="' + h + '" rx="' + Math.min(w, h) / 2 + '" fill="' + bg + '"/>' +
            '<text x="50%" y="54%" font-size="' + (h * 0.4) + '" fill="#fff" text-anchor="middle" ' +
            'dominant-baseline="middle" font-family="sans-serif">' + label + '</text></svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
    }
    function rect(w, h, bg, label) {
        var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
            '<rect width="' + w + '" height="' + h + '" rx="4" fill="' + bg + '"/>' +
            '<text x="50%" y="55%" font-size="' + (h * 0.5) + '" fill="#fff" text-anchor="middle" ' +
            'dominant-baseline="middle" font-family="sans-serif">' + label + '</text></svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
    }
    window.__gallery = { svg: svg, rect: rect };

    var COLORS = ['#0088cc', '#9b59b6', '#5cb85c', '#f0ad4e', '#d9534f', '#3498db'];
    var USERS = [
        { Id: 'u1', Name: 'Alice',   Policy: { IsAdministrator: true },  PrimaryImageTag: 't1' },
        { Id: 'u2', Name: 'Bob',     Policy: { IsAdministrator: false }, PrimaryImageTag: 't2' },
        { Id: 'u3', Name: 'Carol',   Policy: { IsAdministrator: false }, PrimaryImageTag: null },
        { Id: 'u4', Name: 'Dave',    Policy: { IsAdministrator: true },  PrimaryImageTag: 't4' },
        { Id: 'u5', Name: 'Eve',     Policy: { IsAdministrator: false }, PrimaryImageTag: 't5' }
    ];

    // Mock media rows for the paginated table.
    var STATUSES = ['Synced', 'Queued', 'Errored', 'Downloading', 'Ignored', 'Imported'];
    var ITEMS = [];
    for (var i = 1; i <= 57; i++) {
        ITEMS.push({
            id: 'item-' + i,
            name: 'Episode ' + i + ' — The One With The ' + ['Cache', 'Sync', 'Retry', 'Backoff', 'Token'][i % 5],
            sizeBytes: (i * 37 % 900 + 20) * 1024 * 1024,
            status: STATUSES[i % STATUSES.length]
        });
    }

    window.Dashboard = { alert: function (m) { window.alert(typeof m === 'string' ? m : (m && m.message) || 'alert'); } };

    var config = { Demo: true, Count: 1 };
    window.ApiClient = {
        getUsers: function () { return Promise.resolve(USERS.slice()); },
        getUserImageUrl: function (id, o) {
            var u = USERS.filter(function (x) { return x.Id === id; })[0];
            return svg(56, 56, COLORS[USERS.indexOf(u) % COLORS.length], (u ? u.Name[0] : '?'));
        },
        getPluginConfiguration: function () { return Promise.resolve(JSON.parse(JSON.stringify(config))); },
        updatePluginConfiguration: function (id, c) { config = c; return Promise.resolve(c); },
        getUrl: function (u) { return u; },
        fetch: function (opts) {
            // Serve the mock paginated table from the query string.
            var q = {};
            (opts.url.split('?')[1] || '').split('&').forEach(function (p) {
                var kv = p.split('='); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || '');
            });
            var skip = parseInt(q.skip || '0', 10), take = parseInt(q.take || '50', 10);
            var filtered = ITEMS.filter(function (it) {
                return !q.search || it.name.toLowerCase().indexOf(q.search.toLowerCase()) !== -1;
            });
            return Promise.resolve({ Items: filtered.slice(skip, skip + take), TotalCount: filtered.length });
        }
    };
    window.__galleryData = { USERS: USERS, ITEMS: ITEMS, COLORS: COLORS, STATUSES: STATUSES };
})();
</script>

<script type="module">
import * as JPK from '../../dist/jpkribs_shared.js';

const view = document.getElementById('view');
const D = window.__galleryData;
const G = window.__gallery;
const shared = JPK.createShared(view, 'gallery-plugin-id', 'Gallery');

// section(title) -> a card element you append content into.
function section(title) {
    const s = document.createElement('div');
    s.className = 'g-section';
    const h = document.createElement('h2');
    h.textContent = title;
    s.appendChild(h);
    view.appendChild(s);
    return s;
}
function row(parent) {
    const r = document.createElement('div');
    r.className = 'g-row';
    parent.appendChild(r);
    return r;
}
function html(parent, markup) {
    const d = document.createElement('div');
    d.innerHTML = markup;
    parent.appendChild(d);
    return d;
}

// ---- Palette ----
(function () {
    const s = section('Palette & tokens');
    const wrap = document.createElement('div');
    wrap.className = 'g-swatches';
    [['--jpk-accent', 'accent'], ['--jpk-success', 'success'], ['--jpk-warning', 'warning'],
     ['--jpk-error', 'error'], ['--jpk-info', 'info'], ['--jpk-purple', 'purple'], ['--jpk-border', 'border']]
    .forEach(([v, name]) => {
        const sw = document.createElement('div');
        sw.className = 'g-swatch';
        sw.innerHTML = '<div class="chip" style="background:var(' + v + ')"></div>' + name;
        wrap.appendChild(sw);
    });
    s.appendChild(wrap);
})();

// ---- Buttons ----
(function () {
    const s = section('Buttons');
    const r = row(s);
    r.innerHTML =
        '<button class="raised jpk-button-submit">Submit</button>' +
        '<button class="raised jpk-button-primary">Primary</button>' +
        '<button class="raised jpk-button-destructive">Delete</button>' +
        '<button class="raised jpk-secondary">Secondary</button>' +
        '<button class="raised jpk-button-small">Small</button>' +
        '<button class="jpk-icon-btn"><span class="material-icons">add</span><span>Icon button</span></button>';
})();

// ---- Status callouts ----
(function () {
    const s = section('Status callouts');
    html(s, '<div class="jpk-info">jpk-info — a neutral hint or guidance.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-success">jpk-success — a healthy or completed state.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-warn">jpk-warn — a caution worth heeding.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-error">jpk-error — a blocking problem.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-neutral">jpk-neutral — a muted, inactive note.</div>').style.marginBottom = '8px';
    html(s, '<div class="jpk-error-message">TypeError: cannot read properties of undefined (reading \'Items\')</div>');
})();

// ---- setStatus (class-based) ----
(function () {
    const s = section('Status text — shared.setStatus');
    const line = document.createElement('span');
    line.id = 'demoStatus';
    line.className = 'jpk-status-text';
    const r = row(s);
    const ok = document.createElement('button'); ok.className = 'raised jpk-button-small'; ok.textContent = 'Show success';
    const bad = document.createElement('button'); bad.className = 'raised jpk-button-small'; bad.textContent = 'Show error';
    ok.onclick = () => shared.setStatus('demoStatus', 'Saved successfully.', false, { timeout: 0 });
    bad.onclick = () => shared.setStatus('demoStatus', 'Something went wrong.', true, { timeout: 0 });
    r.appendChild(ok); r.appendChild(bad); r.appendChild(line);
})();

// ---- Cards ----
(function () {
    const s = section('Count cards — shared.renderCards');
    const host = document.createElement('div'); host.id = 'demoCards';
    s.appendChild(host);
    shared.renderCards('demoCards', [
        { label: 'Queued', count: 12, color: 'orange' },
        { label: 'Synced', count: 340, color: 'green' },
        { label: 'Errored', count: 3, color: 'red' },
        { label: 'Ignored', count: 8, color: 'gray' },
        { label: 'Pending', count: 21, color: 'purple' }
    ]);
    // Record card
    html(s, '<div class="jpk-record-card" style="margin-top:14px">' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Last run</span><span>2 minutes ago</span></div>' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Result</span><span class="jpk-mono">OK</span></div>' +
        '<div class="jpk-record-row"><span class="jpk-record-label">Address</span><span class="jpk-mono">203.0.113.7</span></div>' +
        '</div>');
})();

// ---- Badges ----
(function () {
    const s = section('Badges — BADGE_STATES');
    const r = row(s);
    JPK.BADGE_STATES.names.forEach(n => r.insertAdjacentHTML('beforeend', shared.statusBadge(n, n) + ' '));
    const r2 = row(s); r2.style.marginTop = '10px';
    JPK.BADGE_STATES.colors.forEach(c => r2.insertAdjacentHTML('beforeend', shared.badge(c, c) + ' '));
})();

// ---- Tags ----
(function () {
    const s = section('Tags');
    html(s, '<div class="jpk-tags">' +
        ['Action', 'Comedy', 'Drama', 'Sci-Fi'].map(t =>
            '<span class="jpk-tag">' + t + '<span class="jpk-tag-remove">×</span></span>').join('') +
        '</div>');
})();

// ---- Fields ----
(function () {
    const s = section('Fields & inputs');
    html(s, '<div class="jpk-field-row">' +
        '<div class="jpk-field"><label>Host name</label><input type="text" value="server.example.com" /></div>' +
        '<div class="jpk-field"><label>Port</label><input type="number" value="8096" /></div>' +
        '</div>');
    html(s, '<div class="inputContainer"><label>API key</label><input type="password" value="secret-value" /></div>');
    html(s, '<div class="selectContainer"><label>Mode</label><select><option>Allowlist</option><option>Blocklist</option><option>None</option></select></div>');
    html(s, '<div class="inputContainer"><label>Notes</label><textarea rows="2">Multi-line text area.</textarea></div>');
})();

// ---- Selector ----
(function () {
    const s = section('Record selector — jpk-selector');
    html(s, '<div class="jpk-selector">' +
        '<select class="jpk-selector-dropdown"><option>Primary record</option><option>Backup record</option></select>' +
        '<div class="jpk-selector-actions">' +
            '<button class="jpk-icon-btn"><span class="material-icons">add</span><span>New</span></button>' +
            '<button class="jpk-icon-btn"><span class="material-icons">delete</span><span>Delete</span></button>' +
        '</div></div>');
})();

// ---- Collapsibles ----
(function () {
    const s = section('Collapsible sections');
    s.insertAdjacentHTML('beforeend',
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header" data-target="colA">' +
            '<span class="jpk-collapsible-title">Advanced options</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="colA" class="jpk-collapsible-content"><p style="opacity:.7;margin:0">Expanded content lives here.</p></div>' +
        '</div>' +
        '<div class="jpk-collapsible-section">' +
          '<button type="button" class="jpk-collapsible-header collapsed" data-target="colB">' +
            '<span class="jpk-collapsible-title">Starts collapsed</span>' +
            '<span class="jpk-collapsible-icon">▼</span></button>' +
          '<div id="colB" class="jpk-collapsible-content collapsed"><p style="opacity:.7;margin:0">Hidden until toggled.</p></div>' +
        '</div>');
    shared.initCollapsibles();
})();

// ---- Combo box ----
(function () {
    const s = section('Searchable combo box — shared.createSearchableComboBox');
    const OPTIONS = ['Aardvark', 'Albatross', 'Beaver', 'Bison', 'Cheetah', 'Cobra', 'Dolphin', 'Eagle', 'Falcon'];
    const combo = shared.createSearchableComboBox({
        placeholder: 'Type to search animals…',
        searchFn: (q, cb) => cb(OPTIONS.filter(o => !q || o.toLowerCase().indexOf(q.toLowerCase()) !== -1)
            .map(o => ({ value: o.toLowerCase(), label: o }))),
        onSelect: (value) => shared.setStatus('comboStatus', 'Picked: ' + value, false, { timeout: 0 })
    });
    s.appendChild(combo.element);
    const st = document.createElement('span'); st.id = 'comboStatus'; st.className = 'jpk-status-text';
    s.appendChild(st);
})();

// ---- Chip select ----
(function () {
    const s = section('Chip multi-select — createChipSelect');
    const chip = JPK.createChipSelect({
        placeholder: 'Add genres…',
        value: ['drama'],
        options: [
            { value: 'action', label: 'Action' }, { value: 'comedy', label: 'Comedy' },
            { value: 'drama', label: 'Drama' }, { value: 'scifi', label: 'Sci-Fi' },
            { value: 'horror', label: 'Horror' }, { value: 'documentary', label: 'Documentary' }
        ],
        allowCreate: true
    });
    s.appendChild(chip.element);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">Type to filter, click or Enter to add, × or Backspace to remove. allowCreate lets you add a free-typed value.</p>');

    // Single-select variant backed by an async searchFn (the studios/people/language pattern):
    // stores an opaque value but shows a friendly label, keeping at most one selection.
    const LANGS = [
        { value: 'eng', label: 'English' }, { value: 'fra', label: 'French' }, { value: 'deu', label: 'German' },
        { value: 'spa', label: 'Spanish' }, { value: 'jpn', label: 'Japanese' }, { value: 'kor', label: 'Korean' }
    ];
    const lang = JPK.createChipSelect({
        placeholder: 'Search a language…',
        single: true,
        value: [{ value: 'eng', label: 'English' }],
        searchFn: (q, cb) => cb(LANGS.filter(l => !q || l.label.toLowerCase().indexOf(q.toLowerCase()) !== -1)),
        onChange: (values, items) => shared.setStatus('langStatus',
            items.length ? ('stored code: ' + values[0] + ' (label kept: ' + items[0].label + ')') : 'cleared', false, { timeout: 0 })
    });
    lang.element.style.marginTop = '14px';
    s.appendChild(lang.element);
    const st = document.createElement('span'); st.id = 'langStatus'; st.className = 'jpk-status-text';
    s.appendChild(st);
    s.insertAdjacentHTML('beforeend', '<p class="g-note">single: true — an async, searchable single-picker that stores an opaque value (ISO code) but keeps the label via getItems().</p>');
})();

// ---- Checkbox list ----
(function () {
    const s = section('Searchable checkbox list — createCheckboxList');
    const SERIES = [];
    for (let i = 1; i <= 12; i++) {
        SERIES.push({ id: 's' + i, name: 'Series ' + i, year: 2000 + i,
            poster: G.rect(32, 32, D.COLORS[i % D.COLORS.length], String(i)) });
    }
    const list = JPK.createCheckboxList({
        items: SERIES,
        value: ['s2', 's5'],
        disabledIds: ['s9'],
        searchKeys: ['name'],
        showSelectAll: true,
        renderRow: (it) => ({ label: it.name, sublabel: 'First aired ' + it.year, imageUrl: it.poster,
            note: it.id === 's9' ? 'assigned' : '' })
    });
    s.appendChild(list.element);
})();

// ---- User selectors ----
(function () {
    const s = section('User selectors — createUserSelector / createUserMultiSelector');
    const single = shared.createUserSelector({ value: 'u2' });
    s.appendChild(single.element);
    const multi = shared.createUserMultiSelector({ value: ['u1', 'u3'], showSelectAll: true, adminFilter: 'all' });
    multi.element.style.marginTop = '12px';
    s.appendChild(multi.element);
})();

// ---- Dialogs ----
(function () {
    const s = section('Dialogs — openDialog / confirmDialog / promptDialog');
    const r = row(s);
    const b1 = document.createElement('button'); b1.className = 'raised jpk-button-submit'; b1.textContent = 'openDialog';
    b1.onclick = () => JPK.openDialog({
        title: 'A modal dialog',
        body: '<p style="opacity:.8">Backdrop click, the × button, and Escape all close it. Focus is trapped inside.</p>',
        buttons: [
            { text: 'Close', className: 'jpk-secondary', action: (close) => close() },
            { text: 'Primary', className: 'jpk-button-submit', action: (close) => close() }
        ]
    });
    const b2 = document.createElement('button'); b2.className = 'raised jpk-button-destructive'; b2.textContent = 'confirmDialog';
    b2.onclick = () => JPK.confirmDialog('Delete this record? This cannot be undone.', { title: 'Delete record', destructive: true, confirmText: 'Delete' })
        .then(ok => shared.setStatus('dialogStatus', 'confirm resolved: ' + ok, !ok, { timeout: 0 }));
    const b3 = document.createElement('button'); b3.className = 'raised jpk-secondary'; b3.textContent = 'promptDialog';
    b3.onclick = () => JPK.promptDialog(
        [{ name: 'label', label: 'Label', value: 'My record' }, { name: 'ttl', label: 'TTL (seconds)', type: 'number', value: '300' }],
        { title: 'New record', submitText: 'Create' })
        .then(vals => shared.setStatus('dialogStatus', vals ? ('prompt: ' + JSON.stringify(vals)) : 'prompt cancelled', !vals, { timeout: 0 }));
    r.appendChild(b1); r.appendChild(b2); r.appendChild(b3);
    const st = document.createElement('span'); st.id = 'dialogStatus'; st.className = 'jpk-status-text'; st.style.marginTop = '8px';
    s.appendChild(st);
})();

// ---- Change tracker + unsaved indicator ----
(function () {
    const s = section('Unsaved indicator — shared.createChangeTracker');
    const wrap = document.createElement('div');
    wrap.innerHTML =
        '<div class="inputContainer"><label>Edit me ' +
        '<span class="jpk-unsaved" id="demoUnsaved"><span class="jpk-unsaved-dot"></span>Unsaved changes</span>' +
        '</label><input id="demoTrack" type="text" value="initial value" /></div>';
    s.appendChild(wrap);
    const input = wrap.querySelector('#demoTrack');
    const tracker = shared.createChangeTracker({ serialize: () => input.value, indicatorId: 'demoUnsaved' });
    input.addEventListener('input', () => tracker.check());
    const r = row(s);
    const save = document.createElement('button'); save.className = 'raised jpk-button-small'; save.textContent = 'Save (flash)';
    save.onclick = () => tracker.flashSaved();
    r.appendChild(save);
})();

// ---- Poller ----
(function () {
    const s = section('Poller — shared.createPoller');
    const count = document.createElement('span'); count.className = 'jpk-mono'; count.textContent = '0 ticks';
    let n = 0;
    const poller = shared.createPoller(() => { n++; count.textContent = n + ' ticks'; }, 1000);
    const r = row(s);
    const start = document.createElement('button'); start.className = 'raised jpk-button-small'; start.textContent = 'Start';
    const stop = document.createElement('button'); stop.className = 'raised jpk-secondary jpk-button-small'; stop.textContent = 'Stop';
    start.onclick = () => poller.start();
    stop.onclick = () => poller.stop();
    r.appendChild(start); r.appendChild(stop); r.appendChild(count);
})();

// ---- Inline / bulk edit ----
(function () {
    const s = section('Inline & bulk edit');
    s.insertAdjacentHTML('beforeend',
        '<div class="jpk-bulk-edit-bar">' +
          '<div class="jpk-bulk-edit-title">Bulk edit — 3 selected</div>' +
          '<div class="jpk-edit-line">' +
            '<div class="jpk-field"><label>Artist</label><input type="text" placeholder="Set artist" /></div>' +
            '<div class="jpk-field"><label>Album</label><input type="text" placeholder="Set album" /></div>' +
            '<span class="jpk-edit-line-spacer"></span>' +
            '<button class="raised jpk-button-small jpk-button-submit">Apply</button>' +
          '</div>' +
        '</div>');
})();

// ---- Empty section ----
(function () {
    const s = section('Empty state — shared.emptySection');
    s.insertAdjacentHTML('beforeend', shared.emptySection('No records yet. Add one to get started.'));
})();

// ---- Paginated table ----
(function () {
    const s = section('Paginated table — createPaginatedTable');
    const host = document.createElement('div'); host.id = 'demoTable';
    s.appendChild(host);
    JPK.createPaginatedTable(view, shared, {
        containerId: 'demoTable',
        endpoint: 'Items',
        search: { enabled: true, placeholder: 'Search episodes…' },
        selection: { enabled: true, idKey: 'id' },
        columns: [
            { key: 'name', label: 'Name' },
            { key: 'sizeBytes', label: 'Size', type: 'custom', render: (it) => shared.formatSize(it.sizeBytes) },
            { key: 'status', label: 'Status', type: 'status' }
        ],
        getDisplayStatus: (it) => it.status,
        getStatusClass: (it) => it.status
    }).load();
})();
</script>
</body>
</html>
