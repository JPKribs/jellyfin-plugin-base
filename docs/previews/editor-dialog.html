<!-- title: Editor Dialog -->
<!-- min-height: 460 -->
<button type="button" id="btnEdit" class="raised base-button secondary"><span>Edit Server</span></button>
<span id="editorStatus" class="base-status-text"></span>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
shared.bindClick('btnEdit', () => {
    const body = document.createElement('div');
    body.innerHTML = '<div class="inputContainer"><label for="txtEditorName">Name</label>' +
        '<input is="emby-input" type="text" id="txtEditorName" value="Living room"></div>';
    const input = body.querySelector('input');
    base.openEditorDialog({
        title: 'Edit Server',
        body: body,
        isNew: false,
        serialize: () => input.value,
        onDone: () => true,
        onRemove: (close) => close('removed'),
        actions: [{ text: 'Duplicate', icon: 'content_copy', onClick: (editor) => editor.close('duplicated') }],
        onClose: (value) => shared.setStatus('editorStatus', 'Closed with ' + (value || 'a dismissal') + '.', false, { timeout: 0 })
    });
});
</script>
