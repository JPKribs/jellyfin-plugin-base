<!-- title: Schedule Picker -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');
const note = document.createElement('div');
note.className = 'base-status-text';
mount.appendChild(base.createSchedulePicker({ value: { time: '02:30', days: [1, 3, 5] }, onChange: (v) => { note.textContent = JSON.stringify(v); } }).element);
mount.appendChild(note);
</script>
