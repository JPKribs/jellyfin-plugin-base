<div id="mount"></div>
<script type="module">
const JPK = await window.__jpkReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');

document.getElementById('slot').appendChild(JPK.createHelpHint({ text: 'Seconds between checks. A low value adds load on the server.' }).element);
</script>
