<!-- title: Badge -->
<!-- min-height: 0 -->
<div id="colors" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
<div id="states" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>

<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');

base.BADGE_STATES.colors.forEach(color => {
    document.getElementById('colors').insertAdjacentHTML('beforeend', shared.badge(color, color));
});
base.BADGE_STATES.names.forEach(name => {
    document.getElementById('states').insertAdjacentHTML('beforeend', shared.statusBadge(name, name));
});
</script>
