<!-- title: Ordered List -->
<div id="mount"></div>
<span id="orderedStatus" class="base-status-text"></span>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
const order = base.createOrderedList({
    items: ['Intro', 'Verse', 'Chorus', 'Outro'],
    render: (item, index) => ({ primary: Object.assign(document.createElement('strong'), { textContent: item }), secondary: 'Position ' + (index + 1) }),
    label: (item) => item,
    onMove: (from, to, items) => shared.setStatus('orderedStatus', 'Order: ' + items.join(', ') + '.', false, { timeout: 0 })
});
document.getElementById('mount').appendChild(order.element);
</script>
