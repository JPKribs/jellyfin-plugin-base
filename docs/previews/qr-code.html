<!-- title: QR Code -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
document.getElementById('mount').appendChild(base.createQrCode({ value: 'https://jellyfin.example.com/web/#/details?id=4b1e0c2a', label: 'QR code for the invite link' }).element);
const inline = document.createElement('div');
inline.style.marginTop = '24px';
document.getElementById('mount').after(inline);
inline.appendChild(base.createQrCode({ value: 'https://jellyfin.example.com/web/#/details?id=4b1e0c2a', label: 'Invite link', layout: 'inline' }).element);
</script>
