<!-- title: Poller -->
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
    <button type="button" id="btnStart" class="raised base-button primary small"><span>Start</span></button>
    <button type="button" id="btnStop" class="raised base-button secondary small"><span>Stop</span></button>
    <span id="ticks" class="base-mono">0 ticks</span>
    <span id="running" class="base-mono">stopped</span>
</div>
<script type="module">
const base = await window.__baseReady;
const shared = base.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
let ticks = 0;
const poller = shared.createPoller(() => {
    ticks++;
    document.getElementById('ticks').textContent = ticks + ' ticks';
    // A slow tick never overlaps the next one.
    return new Promise((resolve) => setTimeout(resolve, 1500));
}, 1000);
const show = () => { document.getElementById('running').textContent = poller.isRunning() ? 'running' : 'stopped'; };
shared.bindClick('btnStart', () => { poller.start(); show(); });
shared.bindClick('btnStop', () => { poller.stop(); show(); });
</script>
