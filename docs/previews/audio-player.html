<!-- title: Audio Player -->
<div id="mount" style="display: grid; gap: 16px;"></div>
<script type="module">
const base = await window.__baseReady;
const mount = document.getElementById('mount');
// A short tone made in the page, so the preview needs no file.
function tone(freq, seconds) {
    const rate = 8000;
    const n = rate * seconds;
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    s(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / rate * freq * 2 * Math.PI) * 3000 * Math.min(1, (n - i) / 800), true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
mount.appendChild(base.createAudioPlayer({ title: 'theme-song.mp3', src: tone(440, 6) }).element);
mount.appendChild(base.createAudioPlayer({ title: 'Another theme, which pauses the first when it plays', src: tone(660, 4) }).element);
mount.appendChild(base.createAudioPlayer({ title: 'missing.mp3', src: 'missing.mp3' }).element);
</script>
