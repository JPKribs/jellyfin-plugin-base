<!-- title: Progress Bar -->
<div class="jpk-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" aria-label="Download">
    <div class="jpk-progress-bar" style="width: 40%"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px;">
    <button type="button" class="raised jpk-button-submit jpk-btn-progress-host"><span>Run</span><div class="jpk-btn-progress" style="width: 55%"></div></button>
    <button type="button" class="raised jpk-button-destructive jpk-btn-progress-host"><span>Remove</span><div class="jpk-btn-progress" style="width: 55%"></div></button>
    <button type="button" class="raised jpk-btn-progress-host"><span>Plain</span><div class="jpk-btn-progress" style="width: 55%"></div></button>
</div>
