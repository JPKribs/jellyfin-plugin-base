<!-- title: Skeleton -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');
mount.appendChild(base.createSkeleton({ lines: 3 }).element);
const row = document.createElement('div');
row.style.cssText = 'display:flex;align-items:center;gap:12px;margin-top:14px';
row.appendChild(base.createSkeleton({ type: 'circle' }).element);
const block = base.createSkeleton({ type: 'block', size: 'small' }).element;
block.style.flex = '1';
row.appendChild(block);
mount.appendChild(row);
</script>
