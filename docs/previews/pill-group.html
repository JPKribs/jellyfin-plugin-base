<!-- title: Pill Group -->
<div class="jpk-pill-group" id="frequency" role="group" aria-label="Frequency">
    <button type="button" class="jpk-pill" data-value="daily" aria-pressed="false">Daily</button>
    <button type="button" class="jpk-pill" data-value="weekly" aria-pressed="false">Weekly</button>
    <button type="button" class="jpk-pill" data-value="monthly" aria-pressed="false">Monthly</button>
</div>
<span id="frequencyStatus" class="jpk-status-text"></span>
<script type="module">
const JPK = await window.__jpkReady;
const shared = JPK.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
const frequency = JPK.createPillGroup(document.getElementById('frequency'), {
    onChange: (value) => shared.setStatus('frequencyStatus', 'Chose ' + value + '.', false, { timeout: 0 })
});
frequency.set('weekly');
</script>
