<!-- title: Bound Dialog -->
<!-- min-height: 400 -->
<div id="itemDetailModal" class="jpk-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="jpk-dialog-content jpk-dialog-content-narrow">
        <button type="button" id="btnModalClose" class="jpk-dialog-close" aria-label="Close">&times;</button>
        <h2 id="modalTitle" class="jpk-modal-title">Item Detail</h2>
        <div id="modalContent" class="jpk-modal-body"></div>
    </div>
</div>
<button type="button" id="btnDetail" class="raised jpk-button-submit"><span>Open Detail</span></button>
<span id="boundStatus" class="jpk-status-text"></span>
<script type="module">
const JPK = await window.__jpkReady;
const view = document.getElementById('view');
const shared = JPK.createShared(view, 'preview-plugin', 'Preview');
const detail = JPK.bindDialog('itemDetailModal', {
    root: view,
    onClose: () => shared.setStatus('boundStatus', 'Detail closed.', false, { timeout: 0 })
});
shared.bindClick('btnDetail', () => {
    document.getElementById('modalContent').textContent = 'The page filled this body before it opened the dialog.';
    detail.open();
});
</script>
