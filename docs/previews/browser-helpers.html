<!-- title: Browser Helpers -->
<div id="out"></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px;">
    <button type="button" id="btnDownload" class="raised jpk-secondary jpk-button-small"><span>Download JSON</span></button>
</div>
<script type="module">
const JPK = await window.__jpkReady;
const list = JPK.createDefinitionList({ items: [] });
document.getElementById('out').appendChild(list.element);
const items = [
    { label: 'plural', value: JPK.plural(1, 'item') + ', ' + JPK.plural(3, 'item') + ', ' + JPK.plural(2, 'child', 'children'), mono: true },
    { label: 'escapeHtml', value: JPK.escapeHtml('<b>"Tom" & Jerry</b>'), mono: true },
    { label: 'generateGuid', value: JPK.generateGuid(), mono: true },
    { label: 'generateGuid compact', value: JPK.generateGuid({ compact: true }), mono: true }
];
list.setItems(items);
JPK.errorText(new Response(JSON.stringify({ title: 'Bad request' }), { status: 400 }), 'Could not save.')
    .then((text) => list.setItems(items.concat({ label: 'errorText', value: text, mono: true })));

const searched = JPK.debounce((value) => list.setItems(items.concat({ label: 'debounce', value: 'ran once with ' + value, mono: true })), 300);
searched('a'); searched('ab'); searched('abc');

document.getElementById('btnDownload').addEventListener('click', () => JPK.downloadJson('channels.json', [{ name: 'News' }]));
</script>
