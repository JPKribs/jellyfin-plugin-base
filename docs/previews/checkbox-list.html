<!-- title: Checkbox List -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
const { rect } = window.__gallery;
const { COLORS } = window.__galleryData;
const series = [];
for (let i = 1; i <= 12; i++) {
    series.push({ id: 's' + i, name: 'Series ' + i, year: 2000 + i, poster: rect(32, 32, COLORS[i % COLORS.length], String(i)) });
}
const list = base.createCheckboxList({
    items: series,
    value: ['s2', 's5'],
    disabledIds: ['s9'],
    searchKeys: ['name'],
    showSelectAll: true,
    selectAllText: 'Select every series',
    renderRow: (s) => ({ label: s.name, sublabel: 'First aired ' + s.year, imageUrl: s.poster, note: s.id === 's9' ? 'assigned' : '' })
});
document.getElementById('mount').appendChild(list.element);
</script>
