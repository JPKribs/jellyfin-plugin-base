<!-- title: Avatar -->
<div id="mount"></div>
<script type="module">
const JPK = await window.__jpkReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');
mount.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:12px';
mount.appendChild(JPK.createAvatar({ name: 'Ada Lovelace', size: 'small' }).element);
mount.appendChild(JPK.createAvatar({ name: 'Bob Ross', status: 'green' }).element);
mount.appendChild(JPK.createAvatar({ name: 'Carol', size: 'large', status: 'red', statusLabel: 'Offline' }).element);
mount.appendChild(JPK.createUserChip({ name: 'Ada Lovelace', text: 'Administrator', status: 'green' }).element);
</script>
