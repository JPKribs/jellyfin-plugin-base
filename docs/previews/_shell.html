<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="robots" content="noindex" />
<meta name="base-preview-min-height" content="{{MIN_HEIGHT}}" />

<!-- The icon font Jellyfin ships, material-design-icons-iconfont. Its per-icon classes, such as expand_more, draw the icons that have no text. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-design-icons-iconfont@6.7.0/dist/material-design-icons.min.css" />
<!-- The real bundled kit stylesheet -->
<link rel="stylesheet" href="./base/jpkribs_shared.css" />

<style>
    /* Preview chrome only. It sets the Jellyfin palette the kit tokens read, and it never styles a kit class. */
    :root, :root[data-theme="dark"] {
        color-scheme: dark;
        --jf-palette-primary-main: #00a4dc;
        --jf-palette-background-paper: #181818;
        --jf-palette-text-primary: #fff;
        --base-preview-page: #101010;
    }
    :root[data-theme="light"] {
        color-scheme: light;
        --jf-palette-primary-main: #0088cc;
        --jf-palette-background-paper: #fff;
        --jf-palette-text-primary: rgba(0, 0, 0, 0.87);
        --base-preview-page: #f4f4f4;
    }
    html { background: var(--base-preview-page); }
    body {
        margin: 0;
        background: var(--base-preview-page);
        color: var(--jf-palette-text-primary);
        font-family: 'Noto Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    /* The top padding is a strip for the theme toggle, so it never sits over a component's top-right buttons */
    #base-preview-root { padding: 36px 16px 20px; position: relative; }
    #base-preview-theme {
        position: absolute; top: 4px; right: 6px; z-index: 1;
        width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
        background: transparent; color: inherit; opacity: 0.45; cursor: pointer;
        font: 16px/28px 'Material Icons'; overflow: hidden;
    }
    #base-preview-theme:hover, #base-preview-theme:focus-visible { opacity: 1; }
</style>
</head>

<body>
<!-- The wrapper carries pluginConfigurationPage so the form rules apply as on a config page -->
<div class="pluginConfigurationPage">
<div id="base-preview-root">
<button id="base-preview-theme" type="button" title="Switch between light and dark" aria-label="Switch between light and dark">brightness_6</button>
<div id="view">
{{BODY}}
</div>
</div>
</div>

<!-- The shared Jellyfin globals stubs, as a classic script so they exist before any module runs -->
<script src="./base/jellyfin-stubs.js"></script>

<script>
(function () {
    var root = document.documentElement;
    var min = parseInt((document.querySelector('meta[name="base-preview-min-height"]') || {}).content, 10) || 0;
    var params = new URLSearchParams(location.search);

    // Loads the real bundle once. A snippet awaits it: const base = await window.__baseReady;
    window.__baseReady = import('./base/jpkribs_shared.js');
    // Adorns number, date, and time fields as a config page does.
    window.__baseReady.then(function (base) { base.bindFieldAdornments(document.body); });

    function setTheme(theme) {
        root.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    }

    // The theme comes from the query string, then the operating system, and the docs page overrides it by message.
    var initial = params.get('theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(initial);

    document.getElementById('base-preview-theme').addEventListener('click', function () {
        setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    });

    window.addEventListener('message', function (e) {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'base-preview-theme') { return; }
        setTheme(e.data.theme);
    });

    // Reports the content height to the docs page, which sizes the frame to it.
    var last = 0;
    function report() {
        var h = Math.max(Math.ceil(document.getElementById('base-preview-root').getBoundingClientRect().height), min);
        if (h === last) { return; }
        last = h;
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'base-preview-height', height: h }, location.origin);
        }
    }
    if (window.ResizeObserver) {
        new ResizeObserver(report).observe(document.getElementById('base-preview-root'));
    }
    window.addEventListener('load', function () {
        report();
        if (window.parent !== window) {
            window.parent.postMessage({ type: 'base-preview-ready' }, location.origin);
        }
    });
})();
</script>

</body>
</html>
