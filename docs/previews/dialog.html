<!-- title: Dialog -->
<!-- min-height: 460 -->
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <button type="button" id="btnOpen" class="raised jpk-button-submit"><span>Open Dialog</span></button>
    <button type="button" id="btnWide" class="raised jpk-secondary"><span>Open Wide Dialog</span></button>
</div>
<span id="dialogStatus" class="jpk-status-text"></span>
<script type="module">
const JPK = await window.__jpkReady;
const shared = JPK.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
shared.bindClick('btnOpen', () => JPK.openDialog({
    title: 'Session Log',
    body: '<p>The backdrop, the close button, and Escape all close it.</p>',
    narrow: true,
    buttons: [
        { text: 'Close', className: 'jpk-secondary', action: (close) => close() },
        { text: 'Retry', className: 'jpk-button-submit', value: 'retry' }
    ],
    onClose: (value) => shared.setStatus('dialogStatus', 'Closed with ' + (value || 'nothing') + '.', false, { timeout: 0 })
}));
shared.bindClick('btnWide', () => {
    let fields = '';
    for (let i = 1; i <= 12; i++) {
        fields += '<div class="inputContainer"><label>Field ' + i + '</label><input type="text" value="Value ' + i + '"></div>';
    }
    JPK.openDialog({
        title: 'Wide Dialog',
        wide: true,
        body: fields,
        buttons: [
            { text: 'Remove', className: 'jpk-button-destructive', action: (close) => close() },
            { text: 'Cancel', className: 'jpk-secondary', action: (close) => close() },
            { text: 'Done', className: 'jpk-button-submit', action: (close) => close() }
        ]
    });
});
</script>
