<!-- title: Status Page -->
<!-- min-height: 440 -->
<iframe id="card" title="Status page" style="width: 100%; height: 420px; border: 0; border-radius: 8px;"></iframe>
<script type="module">
await window.__baseReady;
// The built preview copies the real template next to the bundle, and this fills it the way StatusPage.Render does.
const template = await (await fetch('./base/status.html')).text();
const encode = (value) => value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const values = {
    TITLE: 'Sign in required',
    HEADING: 'Sign in required',
    MESSAGE: encode('Sign in to Jellyfin first.'),
    SPINNER: '',
    BUTTON: '<a class="base-btn" href="#">Back to Jellyfin</a>',
    CONTENT: ''
};
const logo = window.__gallery.rect(72, 72, '#00a4dc', 'J');
const page = template
    .replace('../web/favicons/touchicon.png', logo)
    .replace('<link rel="icon" href="favicon.ico" />', '')
    .replace(/\{\{(\w+)\}\}/g, (_, key) => values[key] ?? '');
document.getElementById('card').srcdoc = page;
</script>
