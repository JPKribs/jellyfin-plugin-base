<!-- title: Field and Field Row -->
<div class="base-field-row">
    <div class="base-field">
        <label for="txtHost">Host</label>
        <input is="emby-input" type="text" id="txtHost" value="server.example.com" />
    </div>
    <div class="base-field base-field-fixed">
        <label for="txtPort">Port</label>
        <input is="emby-input" type="number" id="txtPort" value="8096" />
    </div>
    <div class="base-field">
        <label for="selScheme">Scheme</label>
        <select is="emby-select" id="selScheme"><option>https</option><option>http</option></select>
    </div>
</div>
