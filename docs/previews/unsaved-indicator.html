<!-- title: Unsaved Indicator -->
<h3 style="margin: 0 0 12px;">Settings <span class="base-unsaved" id="indicator"><span class="base-unsaved-dot"></span>Unsaved changes</span></h3>
<div style="display: flex; flex-wrap: wrap; gap: 10px;">
    <button type="button" id="btnShow" class="raised base-button small"><span>Show</span></button>
    <button type="button" id="btnHide" class="raised base-button secondary small"><span>Hide</span></button>
    <button type="button" id="btnSaved" class="raised base-button secondary small"><span>Saved Look</span></button>
</div>
<script type="module">
await window.__baseReady;
const indicator = document.getElementById('indicator');
document.getElementById('btnShow').addEventListener('click', () => indicator.classList.add('visible'));
document.getElementById('btnHide').addEventListener('click', () => indicator.classList.remove('visible', 'save-success'));
document.getElementById('btnSaved').addEventListener('click', () => indicator.classList.add('visible', 'save-success'));
indicator.classList.add('visible');
</script>
