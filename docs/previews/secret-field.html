<!-- title: Secret Field -->
<div class="inputContainer">
    <label for="txtApiKey">API Key</label>
    <input is="emby-input" type="password" id="txtApiKey" />
    <button is="emby-button" type="button" id="btnClearApiKey" class="raised base-button secondary small hidden"><span>Clear</span></button>
</div>
<div style="display: flex; gap: 10px; align-items: center;">
    <button type="button" id="btnRead" class="raised base-button small"><span>Read</span></button>
    <span id="readOut" class="base-mono"></span>
</div>
<script type="module">
const base = await window.__baseReady;
const input = document.getElementById('txtApiKey');
base.bindSecretField(input, true, { clearButton: document.getElementById('btnClearApiKey') });
document.getElementById('btnRead').addEventListener('click', () => {
    document.getElementById('readOut').textContent = JSON.stringify(base.readSecretField(input));
});
</script>
