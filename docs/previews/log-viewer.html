<!-- title: Log Viewer -->
<div id="mount"></div>
<script type="module">
const base = await window.__baseReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');
const log = base.createLogViewer({ maxLines: 50, lines: [
    { text: 'Starting the session', level: 'info', time: '10:00:01' },
    { text: 'Retrying in 5 seconds', level: 'warn', time: '10:00:03' },
    { text: 'Could not reach the server', level: 'error', time: '10:00:08' },
    { text: 'Detail line', level: 'debug', time: '10:00:08' }
] });
mount.appendChild(log.element);
let n = 0;
const button = document.createElement('button');
button.type = 'button';
button.className = 'raised base-button small';
button.style.marginTop = '10px';
button.textContent = 'Append Lines';
button.addEventListener('click', () => { for (let i = 0; i < 5; i++) log.append('Line ' + (++n)); });
mount.appendChild(button);
</script>
