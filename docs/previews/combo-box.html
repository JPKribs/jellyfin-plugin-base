<!-- title: Combo Box -->
<!-- min-height: 260 -->
<div id="mount"></div>
<span id="comboStatus" class="jpk-status-text"></span>
<script type="module">
const JPK = await window.__jpkReady;
const shared = JPK.createShared(document.getElementById('view'), 'preview-plugin', 'Preview');
const animals = ['Aardvark', 'Albatross', 'Beaver', 'Bison', 'Cheetah', 'Cobra', 'Dolphin', 'Eagle', 'Falcon'];
const combo = shared.createSearchableComboBox({
    placeholder: 'Search animals',
    searchFn: (query, cb) => cb(animals
        .filter((a) => !query || a.toLowerCase().indexOf(query.toLowerCase()) !== -1)
        .map((a) => ({ value: a.toLowerCase(), label: a }))),
    onSelect: (value) => shared.setStatus('comboStatus', 'Picked ' + value + '.', false, { timeout: 0 })
});
document.getElementById('mount').appendChild(combo.element);
</script>
