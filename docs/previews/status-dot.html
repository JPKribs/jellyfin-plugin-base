<!-- title: Status Dot -->
<div id="mount"></div>
<script type="module">
const JPK = await window.__jpkReady;
const view = document.getElementById('view');
const mount = document.getElementById('mount');
mount.style.cssText = 'display:flex;align-items:center;gap:12px';
['green', 'red', 'orange', 'purple', 'blue', 'gray'].forEach((color) => mount.appendChild(JPK.createStatusDot({ color }).element));
</script>
