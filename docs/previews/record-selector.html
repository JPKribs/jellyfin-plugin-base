<!-- title: Record Selector -->
<div class="jpk-selector">

    <div class="jpk-selector-actions">
        <button type="button" class="jpk-icon-btn"><span class="material-icons" aria-hidden="true">add</span><span>New</span></button>
        <button type="button" class="jpk-icon-btn"><span class="material-icons" aria-hidden="true">delete</span><span>Remove</span></button>
    </div>
</div>
