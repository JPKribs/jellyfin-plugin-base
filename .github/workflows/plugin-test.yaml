name: '🧪 Test Plugin'

# Called by each plugin's test.yaml. Restores, builds and tests the solution at the repository root, the
# same steps the jellyfin-meta-plugins test workflow ran.

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to set up.'
        type: string
        default: 10.0.x

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal
