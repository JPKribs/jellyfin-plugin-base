name: '🙈 Unlist Package Version'

# Hides a version on nuget.org that should not have shipped. NuGet never deletes a version; unlisting
# removes it from search and from being picked as the latest, while anyone pinned to it keeps working.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The exact nuget.org version to unlist, for example 2026.7.32'
        required: true

permissions:
  contents: read

jobs:
  unlist:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The version reaches the shell through the environment, never spliced into the script, and must be a
      # release version before anything runs with the API key.
      - name: Unlist
        env:
          VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if ! [[ "${VERSION}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            echo "::error::Version must look like YYYY.M.D or YYYY.M.D.N."
            exit 1
          fi
          dotnet nuget delete JPKribs.Jellyfin.Base "${VERSION}" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --non-interactive
