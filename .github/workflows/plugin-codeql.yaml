name: '🔬 Run CodeQL'

# Called by each plugin's scan-codeql.yaml. The same analysis the jellyfin-meta-plugins workflow ran. The
# repository-name guard skips the scan in forks.

on:
  workflow_call:
    inputs:
      repository-name:
        description: 'owner/repo the scan runs in; any other repository skips it.'
        type: string
        required: true
      dotnet-version:
        description: 'The .NET SDK version to set up.'
        type: string
        default: 10.0.x

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: github.repository == inputs.repository-name
    # Kept as a matrix so the check name and code scanning category match the earlier runs.
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
