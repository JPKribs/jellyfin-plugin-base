name: '📚 Publish Docs'

# Builds the mkdocs site and deploys it to GitHub Pages on every push to main that touches the docs.
# Unlike a plugin, Base builds the site here itself. The live previews load the real bundle, so the job
# bundles the CSS and JS and builds the preview pages before the strict mkdocs build. Plugins keep calling
# the reusable plugin-docs.yaml, which this workflow no longer uses.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/build-previews.*'
      - 'scripts/bundle.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'JPKribs.Jellyfin.Base.Tests/gallery/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# Each job asks for only what it needs, so the build never holds the deploy token.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Bundle Shared Assets
        run: bash scripts/bundle.sh

      - name: Build Previews
        run: node scripts/build-previews.mjs

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build Site
        run: |
          pip install mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocs build --strict

      - name: Upload Site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
