site_name: Jellyfin Plugin Base
site_description: Shared C# helpers and configuration page components for Jellyfin plugins.
site_url: https://jpkribs.github.io/jellyfin-plugin-base/
repo_url: https://github.com/JPKribs/jellyfin-plugin-base
repo_name: JPKribs/jellyfin-plugin-base
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs/previews
      check_paths: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/preview.css

extra_javascript:
  - assets/preview.js

# The preview sources are built into assets/previews by scripts/build-previews.mjs, so the sources stay out of the site.
exclude_docs: |
  .*
  /templates/
  /previews/

